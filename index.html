/* ═══ English overlay: 接続表現 ═══ */
const EN_SETSU={
'したがって':['It rained for days. Therefore the match was cancelled.','A <b>written, formal</b> register. In speech use だから. In reading passages what follows is a logical step, rarely the writer\u2019s thesis itself.'],
'そのため':['There are roadworks. For that reason the traffic is heavy.','More neutral than したがって and very common in notices. It points backwards: the cause is in the previous sentence.'],
'つまり / すなわち':['He did not come. In other words, he does not agree.','⚠ The most generous marker in 読解: what follows is the writer\u2019s <b>own summary</b> and is often the answer verbatim. すなわち is the stiffer written version.'],
'要するに':['In short, there was not enough preparation.','It announces that the writer is about to condense everything. If the question asks 「筆者が最も言いたいこと」, hunt for this marker before rereading.'],
'ところが':['I left home early. But then the trains were down.','⚠ Different from しかし: ところが marks an <b>unexpected, factual</b> outcome and does not introduce opinion. It never precedes the writer\u2019s proposal.'],
'ところで':['By the way, has next week\u2019s schedule been settled?','⚠ One syllable from ところが. が = contrast; で = change of topic. Mixing them up rewrites a whole paragraph.'],
'一方 / 一方で':['While the cities grow, the regions shrink.','⚠ Do not confuse it with <b>～一方だ</b> (only increases, one direction). 一方で contrasts two sides; 一方だ describes a single trend.'],
'反面':['It became convenient, but on the flip side something was lost.','It joins <b>two faces of the same thing</b>, not two different things. That is why it attaches straight to the clause with no full stop before it.'],
'むしろ':['Rather than the price, I want to prioritise quality.','It picks B <b>instead of</b> A after denying or qualifying A. Very often it sits in the sentence carrying the thesis.'],
'かえって':['I took the medicine and ended up feeling worse.','⚠ A very strong signal in reading: it marks an outcome <b>opposite to expectation</b> and almost always precedes the turn in the text. Underline it every time.'],
'なお':['Reception is open until five. Please note that we close on Sundays.','⚠ It introduces <b>secondary</b> information. In questions about what a notice is trying to convey, what follows なお is almost never the main point.'],
'ただし':['Admission is free. However, a booking is required.','⚠ It marks the <b>condition</b> — and conditions are exactly what 情報検索 tests. Whenever you see ただし, circle the whole sentence.'],
'もっとも':['He is excellent. That said, he has little experience.','It softens what the writer has just asserted. Do not confuse it with 最も もっとも (the most) — same sound, opposite roles.'],
'さらに / その上':['It is expensive. And on top of that it does not taste good.','Both halves must share the <b>same polarity</b>: two good or two bad. Mixing them jars on a Japanese ear.'],
'しかも':['Cheap, and fast on top of that.','It adds something that <b>reinforces and surprises</b>. More emphatic than その上, and common in advertising copy.'],
'なぜなら / というのは':['I would rather not go out. This is because I am unwell.','⚠ It requires <b>からだ</b> at the end of the sentence. If the question asks なぜ, this construction hands you the answer ready-made.'],
'とはいえ':['It has got safer. That said, we cannot let our guard down.','The writer concedes the previous point and then limits it. The weight of the sentence lies <b>after</b> とはいえ.'],
'いずれにせよ / いずれにしても':['Either way, we have to decide by tomorrow.','It closes off a list of possibilities and announces the conclusion. In 長文 it tends to mark the final paragraph.'],
'あるいは / または / もしくは':['Please contact us by email or telephone.','A difference of register: <b>または</b> on forms and notices, <b>もしくは</b> in legal text, while <b>あるいは</b> can also introduce an alternative hypothesis in argument.'],
'および / ならびに':['Please fill in your name and address.','Documents only. In conversation it sounds comic. It appears in exactly the texts used for 情報検索.'],
'たとえば':['Seasonings, for example salt and sugar.','⚠ A classic trap: what follows is an <b>example, not the thesis</b>. Choices that repeat the example instead of generalising it are wrong.'],
'このように / こうして':['In this way, the cause is not a single one.','It signals that the writer is <b>wrapping up</b> an explanation. Very useful for locating the conclusion without reading everything.'],
'一般に / 一般的に':['It is generally said that young people do not read.','⚠ It often presents the received wisdom the writer is about to <b>demolish</b>. If しかし follows, the thesis is on the other side.'],
'確かに～。しかし～':['It is certainly convenient. However, there are losses.','⚠ The highest-yield pair in all of 読解. The writer concedes in order to turn. <b>His position is always after しかし</b>, never before.'],
'～わけだ':['No wonder it was cold — the window was open.','Different from the わけではない and わけがない on your cards. Here わけだ marks a conclusion that <b>now makes sense</b>.'],
'～のである / ～のだ':['In other words, there simply was not enough time.','⚠ のである is the stamp of the <b>thesis</b> in opinion writing. When a paragraph\u2019s final sentence ends this way, mark it.'],
'～に対して（対比）':['Whereas the elder brother is quiet, the younger one talks a lot.','Different from the に対して of direction (客に対して). This one compares <b>two parallel things</b> and follows のに.'],
'まず / 次に / 最後に':['First boil the water, then add the noodles.','In procedural texts these three reconstruct the correct order — that is how you answer 「まず何をすべきか」.'],
'そもそも':['To begin with, this plan was never workable.','The writer steps back to the premise to question it. A signal that fundamental criticism is coming, not a detail.'],
'いわゆる':['The so-called work-style reform is moving ahead.','It marks the term as what <b>society</b> calls it, and often carries the writer\u2019s distance from that label.'],
'ちなみに':['Incidentally, entry is free.','Like なお, it introduces side information. In notices, what follows is rarely the main point of the message.'],
'それにしても':['I know he is busy. Even so, he could at least have let us know.','It accepts the other side\u2019s argument and still registers dissatisfaction. Colloquial in tone, common in 聴解 dialogue.']
};
/* ═══ English overlay: 助詞の使い分け ═══ */
const EN_JOSHI={
'に / で（場所）':['There are desks in the classroom. / I study in the classroom.','⚠ The deciding rule: if the verb is ある・いる・住む・勤める → <b>に</b>. If it is an action with duration → <b>で</b>. 「会社に働く」✗ → 会社で働く.'],

'まで / までに':['I work until five. / I will hand it in by five.','⚠ One syllable changes everything. まで needs a <b>durative</b> verb (働く・待つ); までに needs a <b>punctual</b> one (出す・着く). A guaranteed N2 question.'],
'から / ので':['It is cold, so I am going home. / As the train was delayed, I was late.','For apologies and formal requests prefer <b>ので</b>: it reads as circumstance rather than your own will. から after an apology can sound defensive.'],
'だけ / しか～ない':['I have a thousand yen. / I only have a thousand yen (and it is not enough).','⚠ しか carries <b>insufficiency</b> and demands a negative verb. Same number, opposite feeling: だけ is neutral or even sufficient.'],
'ばかり / だけ':['He does nothing but play. / It is only playing.','ばかり is not a synonym of だけ: it accuses an imbalance. And ～たばかり (have just done) is a separate pattern — do not merge them.'],
'さえ / すら / まで':['Even a child knows that.','さえ also forms a minimum condition: <b>～さえ～ば</b> (基本さえ守れば). すら is written and stronger; まで marks the far end of a scale.'],
'こそ':['This year I am passing.','Roberto: your particle. It implies the earlier attempts did not work. Also in 「こちらこそ」= no, thank <em>you</em>.'],
'でも / ても':['Let us have a coffee or something. / Even if it rains, I am going.','⚠ Different roles. でも after a noun softens a suggestion ("a coffee or something"); ても is concessive ("even if").'],

'おきに / ごとに':['I go every other day. / It changes with each day.','⚠ 一日おきに = every <b>other</b> day (skipping one). 一日ごとに = every single day. A classic miscalculation in 情報検索.'],
'と / に（相手）':['I talk with a friend. / I tell a friend.','と implies exchange; に implies one direction. 「先生と相談する」(we discuss) vs 「先生に相談する」(I ask his advice).'],
'や / と（並列）':['I take the book and the dictionary. / I take things like a book and a dictionary.','や leaves the list open and usually comes with など. In 内容一致 questions, や signals that other unlisted items exist.'],
'によって':['The way people think varies from person to person.','Three uses in one: agent of the passive (発見された), means (話し合いによって) and variation (人によって). Context decides, not the form.'],
'について / に対して / にとって':['To talk about the environment. / To be polite toward a customer. / For me it is important.','⚠ The trio that most trips up Romance-language speakers, because "about/for" covers all three. について = topic; に対して = target of the action; にとって = standpoint, always with an evaluation.'],
'ながら / つつ':['I walk while listening to music.','It requires the <b>same subject</b> for both actions. For different subjects use 間に. And ながら is also concessive — context separates them.'],
'は / が（新旧情報）':['Once there was a man. That man...','⚠ Rule of thumb: the <b>first</b> mention takes が; from the second onward, は. In questions, 何が / 誰が always take が, and so does the answer.'],
'は / が（対比と排他）':['I am not going (others might). / I am the one going.','「私が行きます」= it is <b>me</b> and nobody else. Using が where は would do sounds insistent, even aggressive.'],
'のに / ために':['This tool is used for opening things. / I bought it in order to open them.','⚠ This のに is not the concessive のに ("although"). It comes before 使う・必要だ・便利だ and states what an object is <b>used for</b>.'],
'ずつ':['I hand out two to each person.','It also marks gradual progression: 少しずつ・一歩ずつ. It turns up in texts about habit and study.'],
'中（じゅう / ちゅう）':['I walked all day long. / I am in a meeting.','⚠ Same kanji, two readings, two meanings. 今日中に = by the end of today (a deadline). 今週中 can be either — context rules.'],
'ばかりに / だけに':['Just because I let my guard down, I lost. / Precisely because he has experience, he is calm.','⚠ Similar shapes, opposite signs. ばかりに always regrets; だけに confirms what you would expect.'],

'～も～ば～も':['I have neither money nor time.','A fixed pattern with the ば form in the middle. Very often used with double negatives, which is why it trips up fast reading.'],
'かどうか / か':['I do not know whether he is coming. / I do not know when he is coming.','⚠ If the embedded question contains 何・誰・いつ・どこ, use plain <b>か</b>. If it is yes-or-no, use <b>かどうか</b>. Never もし and never たら.']
};

'Correct order: 誰でも【簡単に】【やれる】【という】ものではない。→ ★ = <b>やれる</b>.<br>Fixed block: 「～というものではない」= "it\'s not that simply...". Anchor the block at the end and build backwards.',
'The key is the final sentence: <b>～ないかぎり…難しい</b> = "unless..., it will be difficult". In N2 passages the <b>thesis almost always sits in the last sentence</b>, and markers like しかし・かえって・～ないかぎり flag the turn. Underline them before you look at the choices.',
'Roberto — this passage is about <b>you</b>. 「訳すのではなく、場面ごと覚える」: don\'t translate, memorise the <b>situation</b>. Reading note: 「かえって」signals a reversal of expectation and almost always comes right before the author\'s thesis.',
'<b>Information-retrieval</b> questions are solved by hunting conditions: 「一回だけ」「予約が入っていない場合に限り」「前日までに」「カウンターまたはウェブサイト」. Read the question <b>first</b>, then scan for the condition — don\'t read the whole text.',
'<b>ものだから</b> = "it\'s because..." (justification). ものの would be concessive; ものなら an unlikely hypothesis; ものか an emphatic denial.',
'<b>Vた + ところで</b> = "even if I do, it\'s pointless". Always with a negative or futile result.',
'<b>伺う</b> = the humble form of 聞く (I ask). お聞きになる would be honorific (the teacher asks) — the classic error of swapping 尊敬語 and 謙譲語.',
'<b>ご覧になる</b> = the honorific form of 見る. 「ご覧ください」is also correct; among these options ご覧になってください is the acceptable full form.',
'<b>N を対象にする</b> = to target (an audience). A fixed collocation, very frequent in N2 business texts.',
'<b>普及</b> = to spread widely through a population (technology, a habit). 拡大 = to grow in size; 増加 = to rise in number.',
'<b>控える</b> = to go easy on, abstain from (health, consumption). 抑える = to suppress (emotion, cost). English "cut down / hold back" covers both; the collocation decides.',
'<b>ざるを得ない</b> ≒ <b>ないわけにはいかない</b>: no alternative available. This pair appears directly in the paraphrase section.',
'<b>にわたって</b> = across the whole span. Don\'t confuse it with ～おきに (at intervals) or ～以内 (within).'
];

/* pixel sprite → inline SVG (no external images, works offline) */
function spriteSVG(name,px=7){
  const s=SPRITES[name];if(!s)return'';
  let r='';
  s.g.forEach((row,y)=>{let x=0;while(x<16){
    const c=row[x];if(c==='.'){x++;continue;}
    let w=1;while(x+w<16&&row[x+w]===c)w++;           /* merge runs → fewer nodes */
    r+=`<rect x="${x}" y="${y}" width="${w}" height="1" fill="${s.p[+c]}"/>`;x+=w;}});
  return `<svg class="sprite" viewBox="0 0 16 16" width="${16*px}" height="${16*px}"
    shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
const SPRITE_NAMES=Object.keys(SPRITES);

/* her voice — shown verbatim, not translated */
const CHEERS=[
 'えらい！💜',
 'Good boy, +1 XP.',
 'Roberto survived another day of Japanese.',
 '日本語に勝つまで逃がさない 😈',
 'Hoje já chega. Vai descansar.',
 'Proud of you, always.'
];
let cheerBag=[];
function nextCheer(){                                  /* shuffle-bag: no repeats until all seen */
  if(!cheerBag.length){cheerBag=CHEERS.map((_,i)=>i).sort(()=>Math.random()-.5);}
  return CHEERS[cheerBag.pop()];
}
function celebrate(allDone){
  const el=document.getElementById('cheer');if(!el)return;
  const sp=SPRITE_NAMES[Math.floor(Math.random()*SPRITE_NAMES.length)];
  el.innerHTML=`<div class="cheerbox${allDone?' big':''}">
    ${spriteSVG(sp,allDone?9:7)}
    <p class="cheertxt">${nextCheer()}</p>
    ${allDone?`<p class="cheersub">${S.lang==='pt'?'Missão de hoje completa.':'Today\'s mission complete.'}</p>`:''}
  </div>`;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('on'),allDone?4200:2600);
  el.onclick=()=>el.classList.remove('on');
}

function meigenOf(seed){return MEIGEN[Math.abs(seed)%MEIGEN.length];}
function meigenToday(){const d=new Date();
  return meigenOf(d.getFullYear()*372+d.getMonth()*31+d.getDate());}
function meigenBox(m,label){return `<div class="meigen">
  <div class="lbl" style="font-size:9.5px;letter-spacing:.2em;font-weight:800;color:var(--yama)">${label}</div>

  <div class="tr">${S.lang==='pt'?m.pt:m.en}</div>
  <div class="src">— ${m.src}</div>
  <div class="mn"><b style="color:var(--mura)">${L('mgNote')}:</b> ${S.lang==='pt'?m.note:m.noteEn}</div>
</div>`;}

/* APPEND ONLY — the original 66 keep indices 0-65, so every k-record stays valid */

Object.assign(EN_KMN,EN_KMN_B1,EN_KMN_B2,EN_KMN_B3,EN_KMN_B4);

/* the four expression decks carry [translation, note] pairs — fold them into the same lookup */
[EN_KEIGO,EN_JITA,EN_SETSU,EN_JOSHI].forEach(o=>Object.entries(o).forEach(([k,[tx,trap]])=>{
  EN_GTX[k]=tx;EN_GTRAP[k]=trap;}));
/* ═══════════════ 自動生成ドリル ═══════════════
   検証済みのカードデータから機械的に問題を作る。
   乱数は使わず index から決定するので、番号は毎回同じ＝記録が壊れない。 */
function _rng(n){let x=(n*2654435761)>>>0;x^=x>>>15;x=(x*2246822507)>>>0;x^=x>>>13;return (x>>>0)/4294967296;}
function _pick(pool,n,seed,exclude){
  const out=[],used=new Set(exclude||[]);let i=0;
  while(out.length<n&&i<pool.length*12){
    const c=pool[Math.floor(_rng(seed*997+i)*pool.length)];i++;
    if(c===undefined||used.has(c))continue;
    used.add(c);out.push(c);}
  return out;
}
/* ── 読みの揺さぶり：本試験の誤答と同じ作り方 ── */
const _SWAP={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ',
 'た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
const _UNSWAP={};Object.entries(_SWAP).forEach(([a,b])=>_UNSWAP[b]=a);
function _variants(r){
  const v=new Set();
  for(let i=0;i<r.length;i++){const c=r[i];
    if(_SWAP[c])v.add(r.slice(0,i)+_SWAP[c]+r.slice(i+1));      /* 清音→濁音 */
    if(_UNSWAP[c])v.add(r.slice(0,i)+_UNSWAP[c]+r.slice(i+1));  /* 濁音→清音 */
    if(c==='う'&&i>0)v.add(r.slice(0,i)+r.slice(i+1));           /* 長音を外す */
    if(c==='っ')v.add(r.slice(0,i)+r.slice(i+1));                /* 促音を外す */
    if('あいうえお'.includes(c)===false&&'ょゅゃ'.includes(r[i+1]))
      v.add(r.slice(0,i+1)+r.slice(i+2));                        /* 拗音を外す */
  }
  ['う','ん'].forEach(t=>{if(!r.endsWith(t))v.add(r+t);});       /* 長音・撥音を足す */
  for(let i=0;i<r.length;i++){const c=r[i];
    if('しす'.includes(c))v.add(r.slice(0,i)+(c==='し'?'す':'し')+r.slice(i+1));
    if('んう'.includes(c))v.add(r.slice(0,i)+(c==='ん'?'う':'ん')+r.slice(i+1));}
  v.delete(r);return [...v];
}
const _REAL=new Set();                     /* 実在する読みは誤答に使わない */
KANJI.forEach(k=>k.w.forEach(w=>_REAL.add(w[1])));
[...VOCAB,...VOCAB_N3,...VOCAB_N4,...VOCAB_N2H].forEach(v=>_REAL.add(v.w));

const GEN=[],GEN_EN=[];
/* the same sentence can arrive from two decks (e.g. 子供を育てる sits in JITA and in the N3 vocab).
   Keep the first, drop the rest, and never collide with a hand-written item either. */
const _SEEN=new Set([...MONDAI,...MONDAI_N3,...MONDAI_READ,...MONDAI_R2,...MONDAI_MOJI,
  ...MONDAI_GOI,...MONDAI_BUNPO2,...MONDAI_RUIGI2,...MONDAI_R3A,...MONDAI_R3B,
  ...MONDAI_R3C,...MONDAI_R3D,...MONDAI_R3E].map(q=>q.q));
function _hash(s){let x=5381;for(let i=0;i<s.length;i++)x=((x*33)^s.charCodeAt(i))>>>0;return x.toString(36);}
function _add(item,en){
  if(_SEEN.has(item.q))return;
  _SEEN.add(item.q);
  item.id='q'+_hash(item.q+'|'+item.o[item.a]);   /* stable across future additions */
  GEN.push(item);GEN_EN.push(en);}

/* ── ① 漢字の読み（KANJIの熟語から） ── */
KANJI.forEach((k,ki)=>k.w.forEach(([word,read,gloss],wi)=>{
  const seed=ki*31+wi;
  const cand=_variants(read).filter(x=>!_REAL.has(x));
  if(cand.length<3)return;
  const wrong=_pick(cand,3,seed);
  if(wrong.length<3)return;
  const opts=[read,...wrong];
  const a=Math.floor(_rng(seed+7)*4);
  [opts[0],opts[a]]=[opts[a],opts[0]];
  const g=gloss.split(' / ');
  _add({s:'文字',q:'<u>'+word+'</u> の読み方として最もよいものはどれか。',o:opts,a,
    ex:'<b>'+word+'</b>＝'+read+'（'+g[0]+'）。他の選択肢は清濁・長音・促音を入れ替えただけの形で、実在しません。本試験の問題1はこの作り方で誤答を並べます。'},
   '<b>'+word+'</b> = '+read+' ('+(g[1]||g[0])+'). The other choices only flip voicing, vowel length or a small kana, and are not real readings. Question 1 on the real exam builds its distractors exactly this way.');
}));

/* ── ② 自動詞・他動詞（助詞で答えが一意に決まる） ── */
const _JSKIP=new Set(['出す / 出る']);          /* 部屋を出る は例外なので除外 */
JITA.forEach((p,pi)=>{
  if(_JSKIP.has(p.g))return;
  const [tv,iv]=p.g.split(' / ').map(s=>s.trim());
  const halves=p.ex.split('／').map(s=>s.trim());
  if(halves.length<2)return;
  const other=JITA[(pi+7)%JITA.length].g.split(' / ').map(s=>s.trim());
  [[halves[0],'を',tv],[halves[1],'が',iv]].forEach(([sent,par,ans],hi)=>{
    const m=sent.match(new RegExp('^(.+?)'+par));
    if(!m)return;
    const seed=pi*17+hi;
    const opts=[ans,tv===ans?iv:tv,other[0],other[1]].filter((x,i,arr)=>arr.indexOf(x)===i);
    if(opts.length<4)return;
    const a=Math.floor(_rng(seed+3)*4);
    [opts[0],opts[a]]=[opts[a],opts[0]];
    _add({s:'文法',q:m[1]+par+'（　）。',o:opts,a,
      ex:'助詞が答えを決めます。<b>'+par+'</b>なので'+(par==='を'?'他動詞':'自動詞')+'の<b>'+ans+'</b>。'+
         'を＝他動詞（誰かがする）、が＝自動詞（ひとりでに起こる）。この対は '+p.g+'。'},
     'The particle decides the answer. With <b>'+par+'</b> you need the '+(par==='を'?'transitive':'intransitive')+
     ' form: <b>'+ans+'</b>. を = transitive (somebody does it), が = intransitive (it happens by itself). The pair is '+p.g+'.');
  });
});

/* ── ③ 敬語の方向（尊敬か謙譲か） ── */
const _BASE={};
KEIGO.forEach(k=>{
  const m=k.f.match(/^(.+?)\s*の(尊敬語|謙譲語)/);
  if(!m)return;
  const kind=m[2];
  m[1].split('・').forEach(b=>{b=b.trim();if(!b)return;
    (_BASE[b]=_BASE[b]||{尊敬語:[],謙譲語:[]})[kind].push(k.g.split(' / ')[0]);});
});
const _ALLK=KEIGO.map(k=>k.g.split(' / ')[0]);
Object.entries(_BASE).forEach(([base,kinds],bi)=>{
  ['尊敬語','謙譲語'].forEach((kind,ki)=>{
    const right=kinds[kind];if(!right.length)return;
    const ans=right[0];
    const banned=[...kinds.尊敬語,...kinds.謙譲語];       /* 別解を誤答に混ぜない */
    const seed=bi*23+ki;
    const wrong=_pick(_ALLK.filter(x=>!banned.includes(x)),3,seed);
    if(wrong.length<3)return;
    const opts=[ans,...wrong];
    const a=Math.floor(_rng(seed+5)*4);
    [opts[0],opts[a]]=[opts[a],opts[0]];
    const who=kind==='尊敬語'?'相手の動作':'自分の動作';
    _add({s:'文法',q:'「'+base+'」の'+kind+'として正しいものはどれか。',o:opts,a,
      ex:'<b>'+base+'→'+ans+'</b>（'+kind+'）。'+kind+'は<b>'+who+'</b>に使います。'+
         '主語が誰かをまず確かめること。相手なら尊敬語、自分や身内なら謙譲語です。'},
     '<b>'+base+' → '+ans+'</b> ('+kind+'). '+(kind==='尊敬語'?'Honorific forms describe <b>the other person\u2019s</b> action.':'Humble forms describe <b>your own</b> action, or your group\u2019s.')+
     ' Always check who the subject is first: the other person takes 尊敬語, you and your side take 謙譲語.');
  });
});

/* ── ④ 語彙の文脈規定（例文から語を抜く） ── */
[['v',VOCAB],['w',VOCAB_N3],['x',VOCAB_N4],['y',VOCAB_N2H]].forEach(([key,deck])=>{
  deck.forEach((v,vi)=>{
    const target=v.ex.includes(v.w)?v.w:(v.r!=='—'&&v.ex.includes(v.r)?v.r:null);
    if(!target||target.length<2)return;
    const q=v.ex.replace(target,'（　）');
    if(q===v.ex)return;
    const seed=key.charCodeAt(0)*911+vi;
    /* distractors must share the word class, or the item is decidable at a glance */
    const cls=s=>{
      if(/^[ァ-ヴー]+$/.test(s))return'カ';                       /* katakana */
      if(s.length>=3&&/[うくすつぬむぶぐる]$/.test(s))return'動';  /* verb-ish */
      if(/^[ぁ-ん]+$/.test(s))return'副';                          /* kana adverb */
      return'名';};
    const tc=cls(target);
    const pool=deck.filter(o=>o!==v)
      .map(o=>(o.ex.includes(o.w)?o.w:o.r))
      .filter(s=>s&&s.length>=2&&cls(s)===tc&&!q.includes(s));
    const wrong=_pick(pool.filter(x=>x&&x!==target&&x.length>=2),3,seed,[target]);
    if(wrong.length<3)return;
    const opts=[target,...wrong];
    if(new Set(opts).size<4)return;
    const a=Math.floor(_rng(seed+11)*4);
    [opts[0],opts[a]]=[opts[a],opts[0]];
    _add({s:'語彙',q,o:opts,a,
      ex:'<b>'+target+'</b>＝'+v.pt+'。この文と結びつくのはこの語だけです。語彙は単語ではなく<b>共起する相手</b>ごと覚えること。'},
     '<b>'+target+'</b> = '+v.en+'. It is the only choice that collocates with this sentence. Learn vocabulary together with <b>the words it goes with</b>, never in isolation.');
  });
});

/* ── ⑤ 助詞の選択（カードの例文から、答えが一意に決まるものだけ） ── */
const _PARTS=['に','で','を','が','は','と','へ','から','まで','ばかり','だけ','しか','さえ','ほど'];
JOSHI.forEach((p,pi)=>{
  p.ex.split('／').map(s=>s.trim()).forEach((sent,hi)=>{
    if(!sent||sent.length<6)return;
    /* 見出しに出ている助詞のうち、この文に実際にあるものだけを抜く */
    const cands=p.g.replace(/[（）()]/g,'').split(/[\/／]/).map(s=>s.trim())
      .filter(s=>_PARTS.includes(s)&&sent.includes(s));
    if(cands.length!==1)return;
    const ans=cands[0];
    const idx=sent.indexOf(ans);
    if(idx<1)return;
    const q=sent.slice(0,idx)+'（　）'+sent.slice(idx+ans.length);
    const seed=pi*53+hi;
    const wrong=_pick(_PARTS.filter(x=>x!==ans&&!sent.includes(x)),3,seed);
    if(wrong.length<3)return;
    const opts=[ans,...wrong];
    if(new Set(opts).size<4)return;
    const a=Math.floor(_rng(seed+2)*4);
    [opts[0],opts[a]]=[opts[a],opts[0]];
    _add({s:'文法',q,o:opts,a,
      ex:'正解は<b>'+ans+'</b>。'+p.trap.replace(/<[^>]+>/g,'')},
     'The answer is <b>'+ans+'</b>. '+(EN_JOSHI[p.g]?EN_JOSHI[p.g][1].replace(/<[^>]+>/g,''):''));
  });
});

/* ── ⑥ 自他動詞の助詞選択（動詞が決まれば助詞は一意） ── */
JITA.forEach((p,pi)=>{
  if(_JSKIP.has(p.g))return;
  const [tv,iv]=p.g.split(' / ').map(s=>s.trim());
  p.ex.split('／').map(s=>s.trim()).forEach((sent,hi)=>{
    const verb=hi===0?tv:iv, par=hi===0?'を':'が';
    const m=sent.match(new RegExp('^(.+?)'+par+'(.*)。$'));
    if(!m)return;
    const seed=pi*71+hi;
    const wrong=_pick(['に','で','は','へ','から','も'].filter(x=>x!==par),3,seed);
    if(wrong.length<3)return;
    const opts=[par,...wrong];
    const a=Math.floor(_rng(seed+4)*4);
    [opts[0],opts[a]]=[opts[a],opts[0]];
    _add({s:'文法',q:m[1]+'（　）'+m[2]+'。',o:opts,a,
      ex:'<b>'+verb+'</b>は'+(par==='を'?'<b>他動詞</b>なので、対象は<b>を</b>':'<b>自動詞</b>なので、主体は<b>が</b>')+
         'を取ります。動詞が決まれば助詞は一つに決まります。対は '+p.g+'。'},
     '<b>'+verb+'</b> is '+(par==='を'?'<b>transitive</b>, so its object takes <b>を</b>':'<b>intransitive</b>, so its subject takes <b>が</b>')+
     '. Once the verb is fixed, the particle is fixed too. The pair is '+p.g+'.');
  });
});

/* ── ⑦ 接続表現の穴埋め ── */
const _CONN=SETSU.map(s=>s.g.split(/[\/／]/)[0].trim()).filter(s=>!s.includes('～')&&!s.includes('。'));
SETSU.forEach((s,si)=>{
  const head=s.g.split(/[\/／]/)[0].trim();
  if(head.includes('～')||head.includes('。'))return;
  const idx=s.ex.indexOf(head);
  if(idx<0)return;
  const q=s.ex.slice(0,idx)+'（　）'+s.ex.slice(idx+head.length);
  if(q.length<10)return;
  const seed=si*89;
  const wrong=_pick(_CONN.filter(c=>c!==head&&!s.ex.includes(c)),3,seed);
  if(wrong.length<3)return;
  const opts=[head,...wrong];
  if(new Set(opts).size<4)return;
  const a=Math.floor(_rng(seed+6)*4);
  [opts[0],opts[a]]=[opts[a],opts[0]];
  _add({s:'文法',q,o:opts,a,
    ex:'正解は<b>'+head+'</b>（'+s.pt+'）。'+s.trap.replace(/<[^>]+>/g,'')},
   'The answer is <b>'+head+'</b> ('+s.en+'). '+(EN_SETSU[s.g]?EN_SETSU[s.g][1].replace(/<[^>]+>/g,''):''));
});

/* ── ⑧ 敬語を文中で選ぶ ── */
KEIGO.forEach((k,ki)=>{
  const head=k.g.split(/[\/／]/)[0].trim();
  if(head.includes('～')||head.includes('お')&&head.includes('になる')&&head.length<6)return;
  const stem=head.replace(/る$/,'');
  const idx=k.ex.indexOf(stem);
  if(idx<0||stem.length<2)return;
  const tail=k.ex.slice(idx+stem.length);
  const q=k.ex.slice(0,idx)+'（　）'+tail;
  if(q.indexOf('（　）')<2)return;
  const seed=ki*101;
  const kind=/尊敬/.test(k.f)?'尊敬語':/謙譲/.test(k.f)?'謙譲語':null;
  if(!kind)return;
  const base=(k.f.match(/^(.+?)\s*の/)||[])[1]||'';
  const alt=[];KEIGO.forEach(o=>{if(base&&o.f.includes(base))alt.push(o.g.split(/[\/／]/)[0].trim());});
  const wrong=_pick(_ALLK.filter(x=>x!==head&&!alt.includes(x)&&!x.includes('～')),3,seed);
  if(wrong.length<3)return;
  const opts=[stem,...wrong.map(w=>w.replace(/る$/,''))];
  if(new Set(opts).size<4)return;
  const a=Math.floor(_rng(seed+8)*4);
  [opts[0],opts[a]]=[opts[a],opts[0]];
  _add({s:'文法',q,o:opts,a,
    ex:'<b>'+head+'</b>（'+k.f+'）。'+k.trap.replace(/<[^>]+>/g,'')},
   '<b>'+head+'</b> — '+(EN_KEIGO[k.g]?EN_KEIGO[k.g][1].replace(/<[^>]+>/g,''):k.en));
});

MONDAI.push(...MONDAI_N3,...MONDAI_READ,...MONDAI_R2,...MONDAI_MOJI,...MONDAI_GOI,...MONDAI_BUNPO2,...MONDAI_RUIGI2,...MONDAI_R3A,...MONDAI_R3B,...MONDAI_R3C,...MONDAI_R3D,...MONDAI_R3E,...GEN);
EN_MEX.push(...EN_MEX_N3,...EN_MEX_READ,...EN_MEX_R2,...EN_MEX_MOJI,...EN_MEX_GOI,...EN_MEX_BUNPO2,...EN_MEX_RUIGI2,...EN_MEX_R3A,...EN_MEX_R3B,...EN_MEX_R3C,...EN_MEX_R3D,...EN_MEX_R3E,...GEN_EN);
/* Kill answer-position bias: every item gets a fixed rotation of its options.
   Deterministic, so the layout is stable across sessions, and question indices never move. */
const QKEY=q=>q.id||('m'+MONDAI.indexOf(q));
const QBYKEY={};
MONDAI.forEach((q,i)=>{QBYKEY[q.id||('m'+i)]=i;});
MONDAI.forEach((q,i)=>{const n=q.o.length,r=((i*7)+3)%n;
  q.o=q.o.slice(r).concat(q.o.slice(0,r));q.a=(q.a-r+n)%n;});
const POOL={k:KANJI,v:VOCAB,w:VOCAB_N3,x:VOCAB_N4,y:VOCAB_N2H,
  g:GRAMMAR,h:GRAMMAR_N3,e:KEIGO,j:JITA,c:SETSU,p:JOSHI};
const VKEYS=['y','v','w','x'],GKEYS=['g','h','e','j','c','p'];
const LVNAME={y:'N2+',v:'N2',w:'N3',x:'N4',g:'N2',h:'N3',e:'敬語',j:'自他',c:'接続',p:'助詞'};

const store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY); return r?JSON.parse(r.value):null;} }catch(e){}

  },
  async set(v){
    const j=JSON.stringify(v);
    try{ if(window.storage){await window.storage.set(KEY,j); return;} }catch(e){}

  }
};

/* ═══════════════ SRS (Leitner) ═══════════════ */
const IV=[0,1,2,4,8,16,32];
function srs(id){return S.srs[id]||(S.srs[id]={b:0,due:today(),seen:0,miss:0});}
function grade(id,ok,pick){
  const c=srs(id);c.seen++;
  if(ok){c.b=Math.min(6,c.b+1);c.run=(c.run||0)+1;}
  else{c.b=Math.max(0,c.b-2);c.miss++;c.run=0;c.last=today();
       if(pick!==undefined)c.pick=pick;}
  const d=new Date();d.setDate(d.getDate()+IV[c.b]);
  c.due=d.toISOString().slice(0,10);
  addXP(ok?4:1);save();
}
function dueList(prefix){
  const t=today(),fresh=[],due=[];
  POOL[prefix].forEach((x,i)=>{const id=prefix+i,c=S.srs[id];
    if(!c)fresh.push(i);else if(c.due<=t)due.push(i);});
  return {fresh,due};
}
function addXP(n){S.xp+=n;paintTop();}
const RETIRE=2;                      /* two clean answers and it leaves the notebook */
function isOpen(c){return c&&c.miss>0&&(c.run||0)<RETIRE;}
function openMistakes(){
  const out={q:[],card:[],trap:[]};
  Object.entries(S.srs).forEach(([k,c])=>{
    if(!isOpen(c))return;
    const p=k[0],i=+k.slice(1);
    if(p==='m'&&/^m\d+$/.test(k)){if(MONDAI[i])out.q.push({k,c,i});}
    else if(p==='q'&&QBYKEY[k]!==undefined){out.q.push({k,c,i:QBYKEY[k]});}
    else if(p==='t'){if(TRAPS[i])out.trap.push({k,c,i});}
    else if(POOL[p]&&POOL[p][i])out.card.push({k,c,i,pool:p});});
  const w=x=>-(x.c.miss*10+(x.c.last?1:0));
  Object.values(out).forEach(a=>a.sort((x,y)=>w(x)-w(y)));
  return out;
}
function clearedCount(){return Object.values(S.srs).filter(c=>c.miss>0&&(c.run||0)>=RETIRE).length;}
/* pick the line that drills the exact point missed; otherwise rotate deterministically */
function serifuFor(kind,idx){
  if(kind==='g'&&GRAMMAR[idx]&&SERIFU[GRAMMAR[idx].g])return SERIFU[GRAMMAR[idx].g];
  if(kind==='h'&&GRAMMAR_N3[idx]&&SERIFU[GRAMMAR_N3[idx].g])return SERIFU[GRAMMAR_N3[idx].g];
  return SERIFU[SERIFU_KEYS[(idx*13+kind.charCodeAt(0))%SERIFU_KEYS.length]];
}

function phase(){const d=daysLeft();
  if(d>60)return{n:L('p1'),k:8,v:12,g:5,m:6,t:4,r:2};
  if(d>25)return{n:L('p2'),k:6,v:10,g:6,m:12,t:5,r:3};
  return{n:L('p3'),k:4,v:8,g:4,m:16,t:6,r:4};}
function dayRec(){const t=today();
  if(!S.day[t])S.day[t]={k:0,v:0,g:0,m:0,t:0,r:0,boss:0};
  return S.day[t];}
function isBossDay(){return new Date().getDay()===0;}
function missions(){
  const p=phase(),d=dayRec();
  const l=[
    {id:'k',ic:'漢',t:L('mK',p.k),s:L('mKs'),n:d.k,g:p.k,go:()=>{nav('dojo');startDeck('k')}},
    {id:'v',ic:'語',t:L('mV',p.v),s:L('mVs'),n:d.v,g:p.v,go:()=>{nav('dojo');startVocab()}},
    {id:'g',ic:'文',t:L('mG',p.g),s:L('mGs'),n:d.g,g:p.g,go:()=>{nav('dojo');startGrammar()}},
    {id:'r',ic:'読',t:L('mR',p.r),s:L('mRs'),n:d.r||0,g:p.r,go:()=>{nav('mondai');startMondai(['読解'])}},
    {id:'m',ic:'問',t:L('mM',p.m),s:L('mMs'),n:d.m,g:p.m,go:()=>{nav('mondai');startMondai()}},
    {id:'t',ic:'罠',t:L('mT',p.t),s:L('mTs'),n:d.t,g:p.t,go:()=>{nav('trap');startTrap()}}
  ];
  if(isBossDay())l.push({id:'boss',ic:'戦',t:L('mB'),s:L('mBs'),n:d.boss,g:1,go:()=>{nav('mondai');startBoss()}});
  return l;
}
function checkStreak(){
  const t=today();
  const done=missions().filter(m=>m.n>=m.g).length;
  if(done>=3&&S.lastActive!==t){
    const y=new Date();y.setDate(y.getDate()-1);
    S.streak=(S.lastActive===y.toISOString().slice(0,10))?S.streak+1:1;
    S.lastActive=t;toast(L('streakT',S.streak));save();
  }
}
function doneCount(){return missions().filter(m=>m.n>=m.g).length;}
function bump(k,n=1){
  const m=VKEYS.includes(k)?'v':GKEYS.includes(k)?'g':k;
  const before=doneCount(),total=missions().length;
  dayRec()[m]+=n;
  const after=doneCount();
  checkStreak();save();
  if(after>before)celebrate(after>=total);      /* a mission just flipped to complete */
  if(cur==='home')renderHome();}

function startDeck(key){
  const p=phase(),lim=key==='k'?p.k:VKEYS.includes(key)?p.v:p.g;
  const {fresh,due}=dueList(key);
  const q=[...due.map(i=>({key,i})),...fresh.slice(0,lim).map(i=>({key,i}))];
  if(!q.length){toast(L('nothingHere'));return;}
  deck={q,idx:0,flip:false};nav('dojo');drawCard();
}
/* vocab mission: due items across all active levels first, then new from lowest gap */
function startVocab(){
  const p=phase();let q=[];
  VKEYS.filter(k=>S.levels[k]).forEach(k=>dueList(k).due.forEach(i=>q.push({key:k,i})));
  q.sort(()=>Math.random()-.5);
  if(q.length<p.v){
    for(const k of ['y','v','w','x']){ if(!S.levels[k])continue;
      const f=dueList(k).fresh; for(const i of f){ if(q.length>=p.v)break; q.push({key:k,i}); }
      if(q.length>=p.v)break; }
  }
  if(!q.length){toast(L('nothingHere'));return;}
  deck={q,idx:0,flip:false};nav('dojo');drawCard();
}
function startGrammar(){
  const p=phase();let q=[];
  actG().forEach(k=>dueList(k).due.forEach(i=>q.push({key:k,i})));
  q.sort(()=>Math.random()-.5);
  if(q.length<p.g){for(const k of ['e','p','c','j','g','h']){ if(!S.glevels[k])continue;
    for(const i of dueList(k).fresh){ if(q.length>=p.g)break; q.push({key:k,i}); }
    if(q.length>=p.g)break; }}
  if(!q.length){toast(L('nothingHere'));return;}
  deck={q,idx:0,flip:false};nav('dojo');drawCard();
}
function startReview(){
  let q=[];['k',...actG(),...actV()].forEach(k=>
    dueList(k).due.forEach(i=>q.push({key:k,i})));
  if(!q.length){toast(L('noDue'));return;}
  q.sort(()=>Math.random()-.5);
  deck={q,idx:0,flip:false};nav('dojo');drawCard();
}
function drawCard(){
  if(deck.idx>=deck.q.length){const n=deck.q.length;
    const back=deck.from;deck=null;toast(L('deckDone',n));
    if(back==='miss'){nav('miss');}else{renderDojo();}return;}
  const {key,i}=deck.q[deck.idx],item=POOL[key][i];
  const isV=VKEYS.includes(key);
  const front=key==='k'?kFront(item):isV?vFront(item):gFront(item);
  const back =key==='k'?kBack(item) :isV?vBack(item) :gBack(item);
  const c=srs(key+i);
  const tag=key==='k'?'漢字':(isV?'語彙 ':'文法 ')+LVNAME[key];
  document.getElementById('v-dojo').innerHTML=`
  <div class="counter"><span>${tag} · ${L('box')} ${c.b}</span><span>${deck.idx+1} / ${deck.q.length}</span></div>
  <div class="hp"><i style="width:${deck.idx/deck.q.length*100}%"></i></div>
  <div class="stage"><div class="prompt">${deck.flip?back:front}</div>
  ${deck.flip?`
    <div class="row"><button class="btn" style="border-color:var(--coral);color:var(--coral)" data-g="0">${L('gBad')}</button>
    <button class="btn" data-g="1">${L('gMid')}</button>
    <button class="btn teal" data-g="2">${L('gGood')}</button></div>`:
    `<button class="btn shu" id="flipB">${L('show')}</button>`}
  <button class="btn ghost sm" id="quitB" style="margin-top:10px;color:var(--dim)">${L('quit')}</button></div>`;
  const f=document.getElementById('flipB');
  if(f)f.onclick=()=>{deck.flip=true;drawCard();};
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const g=+b.dataset.g;grade(key+i,g>0);
    if(g===0)deck.q.push(deck.q[deck.idx]);
    bump(key);deck.idx++;deck.flip=false;drawCard();});
  const qb=document.getElementById('quitB');if(qb)qb.onclick=()=>{deck=null;renderDojo();};
}

/* ═══════════════ 今日の50問 ═══════════════ */
const D50=50;
/* the day flips at 04:00, so a late-night session still counts as the same day */
function studyDay(){const d=new Date(Date.now()-4*3600*1000);return d.toISOString().slice(0,10);}
function _dseed(){const d=studyDay();let x=0;for(let i=0;i<d.length;i++)x=((x*31)+d.charCodeAt(i))>>>0;return x;}
/* 60% never seen · 25% seen-and-passed (spaced review) · 15% still open in the notebook */
function dailySet(){
  const seed=_dseed(),t=today();
  const open=[],due=[],fresh=[];
  MONDAI.forEach((q,i)=>{
    const c=S.srs[q.id||('m'+i)];
    if(!c){fresh.push(i);return;}
    if(isOpen(c)){open.push(i);return;}
    if(!c.due||c.due<=t)due.push(i);});
  const take=(arr,n,salt)=>{
    const a=arr.slice().sort((x,y)=>_rng(seed+salt+x)-_rng(seed+salt+y));
    return a.slice(0,n);};
  let pick=[...take(open,Math.round(D50*0.15),11),
            ...take(due,Math.round(D50*0.25),29),
            ...take(fresh,D50,7)];
  pick=[...new Set(pick)].slice(0,D50);
  if(pick.length<D50){                       /* bank exhausted: top up with anything */
    const rest=MONDAI.map((q,i)=>i).filter(i=>!pick.includes(i));
    pick=pick.concat(take(rest,D50-pick.length,53));}
  return {ids:pick.sort((a,b)=>_rng(seed+a)-_rng(seed+b)),
          open:open.length,due:due.length,fresh:fresh.length};
}
function d50State(){
  const d=studyDay();
  if(!S.d50||S.d50.day!==d){const s=dailySet();
    S.d50={day:d,ids:s.ids,pos:0,ok:0,open:s.open,due:s.due,fresh:s.fresh};save();}
  return S.d50;
}
function startDaily(reset){
  const st=d50State();
  if(reset){st.pos=0;st.ok=0;save();}
  if(st.pos>=st.ids.length){toast(L('d50Done'));return;}
  const q=st.ids.slice(st.pos).map(i=>({q:MONDAI[i],i}));
  mo={q,idx:0,ok:0,boss:false,from:'d50'};nav('mondai');drawQ();
}

    if(!j)return;try{S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(j));
      save();paintTop();renderStats();toast(L('tRest'));}catch(e){toast(L('tBad'));}};
  document.getElementById('rst').onclick=()=>{if(confirm(L('askErase'))){
    S=JSON.parse(JSON.stringify(DEF));save();paintTop();renderStats();toast(L('tZero'));}};
}

/* ═══════════════ 起動 ═══════════════ */
(async()=>{
  const saved=await store.get();
  if(saved)S=Object.assign(JSON.parse(JSON.stringify(DEF)),saved);
  if(!S.levels)S.levels={y:true,v:true,w:true,x:true};
  if(S.levels.y===undefined)S.levels.y=true;   /* older saves gain the new deck switched on */
  if(!S.glevels)S.glevels={g:true,h:true};
  GKEYS.forEach(k=>{if(S.glevels[k]===undefined)S.glevels[k]=true;});  /* older saves gain the new decks */
  paintTop();renderHome();
  setInterval(paintTop,60000);
})();

</script>
