<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#191231">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 192 192%22%3E%3Crect width=%22192%22 height=%22192%22 fill=%22%23191231%22/%3E%3Crect x=%2224%22 y=%2224%22 width=%22144%22 height=%22144%22 fill=%22none%22 stroke=%22%23B98CFF%22 stroke-width=%228%22/%3E%3Ctext x=%2296%22 y=%22128%22 font-size=%2292%22 font-family=%22serif%22 font-weight=%22700%22 fill=%22%23FFC93C%22 text-anchor=%22middle%22%3E%E5%92%8C%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 192 192%22%3E%3Crect width=%22192%22 height=%22192%22 fill=%22%23191231%22/%3E%3Crect x=%2224%22 y=%2224%22 width=%22144%22 height=%22144%22 fill=%22none%22 stroke=%22%23B98CFF%22 stroke-width=%228%22/%3E%3Ctext x=%2296%22 y=%22128%22 font-size=%2292%22 font-family=%22serif%22 font-weight=%22700%22 fill=%22%23FFC93C%22 text-anchor=%22middle%22%3E%E5%92%8C%3C/text%3E%3C/svg%3E">
<title>N2日和 — Roberto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 紫 murasaki — primary. 山吹 yamabuki — secondary. Contrast-tested, all ≥4.5:1 */
  --bg:#191231;           /* deep purple ink, page */
  --surf:#241B44;         /* raised surface */
  --surf2:#2E2455;        /* pressed / inset */
  --bord:#4C3C80;         /* visible border */
  --mura:#B98CFF;         /* primary purple, accent text */
  --mura-btn:#6D3FC4;     /* purple fill, white text */
  --mura-dim:rgba(185,140,255,.13);
  --yama:#FFC93C;         /* secondary yellow */
  --yama-dim:rgba(255,201,60,.13);
  --coral:#FF6B76;        /* warning / incorrect */
  --coral-dim:rgba(255,107,118,.15);
  --ok:#5FD68F;           /* correct */
  --ok-dim:rgba(95,214,143,.15);
  --paper:#F6F1FA;        /* card paper face */
  --paper-line:#C6B8DC;   /* genkoyoshi rule */
  --ink:#1B1430;          /* text on paper / on yellow */
  --txt:#F0EAFA;
  --dim:#A79BC4;
  --jp:"Noto Serif JP",serif;
  --ui:"Zen Kaku Gothic New","Archivo",system-ui,-apple-system,sans-serif;
  --disp:"Archivo","Zen Kaku Gothic New",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:var(--ui);overscroll-behavior-y:none}
body{padding-bottom:calc(72px + var(--safe-b))}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}

/* ── halftone atmosphere ───────────────────────────── */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(185,140,255,.075) 1px,transparent 0);
  background-size:6px 6px}

/* ── top bar: countdown strip ──────────────────────── */
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:2px solid var(--bord);padding:10px 14px 8px;
  display:flex;align-items:center;gap:12px}
.days{font-family:var(--disp);font-weight:800;font-size:30px;line-height:.9;color:var(--yama)}
.days small{display:block;font-size:9px;letter-spacing:.22em;color:var(--dim);
  font-weight:600;margin-top:4px}
.topmeta{margin-left:auto;text-align:right;font-size:11px;color:var(--dim);line-height:1.5}
.langtog{border:1.5px solid var(--bord);border-radius:8px;padding:7px 10px;
  font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--dim);flex:0 0 auto}
.langtog:active{background:var(--bord)}
.topmeta b{color:var(--yama);font-size:13px}
.xpbar{height:4px;background:var(--bord);border-radius:2px;margin-top:5px;width:104px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--yama);transition:width .5s}

/* ── layout ────────────────────────────────────────── */
main{position:relative;z-index:1;padding:16px 14px 24px;max-width:620px;margin:0 auto}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--dim);font-weight:700;
  text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--bord)}

.card{background:var(--surf);border:1px solid var(--bord);border-radius:14px;
  padding:16px;margin-bottom:14px}

/* ── SIGNATURE: genkoyoshi 原稿用紙 square ─────────── */
.genko{position:relative;background:var(--paper);border:2.5px solid var(--ink);
  border-radius:3px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.genko::before,.genko::after{content:"";position:absolute;background:var(--paper-line);
  opacity:.75}
.genko::before{left:50%;top:6%;bottom:6%;width:1px;transform:translateX(-.5px);
  background:repeating-linear-gradient(180deg,var(--paper-line) 0 5px,transparent 5px 11px)}
.genko::after{top:50%;left:6%;right:6%;height:1px;transform:translateY(-.5px);
  background:repeating-linear-gradient(90deg,var(--paper-line) 0 5px,transparent 5px 11px)}
.genko .glyph{position:relative;z-index:2;font-family:var(--jp);font-weight:700;
  color:var(--ink);line-height:1}

/* ── buttons ───────────────────────────────────────── */
.btn{display:block;width:100%;padding:15px;border-radius:12px;font-weight:800;
  font-size:15px;background:var(--surf);border:1.5px solid var(--bord);
  transition:transform .1s,background .15s;text-align:center}
.btn:active{transform:scale(.975)}
.btn.shu{background:var(--mura-btn);border-color:var(--mura-btn);color:#fff}
.btn.teal{background:var(--yama);border-color:var(--yama);color:var(--ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:11px;font-size:13px}
.row{display:flex;gap:10px}.row>*{flex:1}

/* ── mission list ──────────────────────────────────── */
.mission{display:flex;align-items:flex-start;gap:12px;padding:13px 0;
  border-bottom:1px dashed var(--bord)}
.mission:last-child{border:0}
.mbox{flex:0 0 24px;height:24px;border:2px solid var(--bord);border-radius:5px;
  display:grid;place-items:center;font-size:14px;color:var(--bg);margin-top:1px}
.mission.done .mbox{background:var(--mura-btn);border-color:var(--mura-btn);color:#fff}
.mission.done .mtitle{text-decoration:line-through;color:var(--dim)}
.mtitle{font-weight:700;font-size:14.5px;line-height:1.35}
.msub{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.5}

/* ── study card ────────────────────────────────────── */
.stage{min-height:58vh;display:flex;flex-direction:column}
.prompt{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:8px 0 20px}
.kanjibox{width:min(200px,54vw);margin:0 auto 18px}
.kanjibox .glyph{font-size:min(118px,32vw)}
.jpline{font-family:var(--jp);font-size:26px;line-height:1.7;font-weight:500}
.jpbig{font-family:var(--jp);font-size:40px;font-weight:700;line-height:1.4}
.reading{font-family:var(--jp);color:var(--mura);font-size:20px;margin-top:6px}
.gloss{margin-top:14px;font-size:16px;line-height:1.5}
.gloss .pt{color:var(--yama);font-weight:700}
.gloss .en{color:var(--dim);font-size:14px;display:block;margin-top:3px}

.mnemo{background:var(--mura-dim);border-left:3px solid var(--mura);
  padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px;line-height:1.65;
  text-align:left;margin-top:16px}
.mnemo b{color:var(--mura)}
.trap{background:var(--coral-dim);border-left:3px solid var(--coral);
  padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px;line-height:1.65;
  text-align:left;margin-top:12px}
.trap b{color:var(--coral)}
.trap .x{font-family:var(--jp);color:var(--coral);text-decoration:line-through}
.trap .o{font-family:var(--jp);color:var(--ok)}

/* ── quiz options ──────────────────────────────────── */
.opt{width:100%;text-align:left;padding:14px;margin-bottom:9px;border-radius:11px;
  background:var(--surf);border:1.5px solid var(--bord);font-size:15px;line-height:1.45;
  display:flex;gap:11px;align-items:flex-start;transition:.15s}
.opt .num{flex:0 0 22px;height:22px;border-radius:5px;background:var(--bord);
  display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.opt.right{background:var(--ok-dim);border-color:var(--ok)}
.opt.right .num{background:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--coral-dim);border-color:var(--coral)}
.opt.wrong .num{background:var(--coral);color:var(--ink)}
.opt:disabled{opacity:1}
.opt.right::after,.opt.wrong::after{margin-left:auto;font-weight:800;font-size:17px;
  line-height:1.2;flex:0 0 auto;padding-left:8px}
.opt.right::after{content:"\2713";color:var(--ok)}
.opt.wrong::after{content:"\2715";color:var(--coral)}
.qjp{font-family:var(--jp);font-size:20px;line-height:1.85;margin-bottom:18px}
.qjp .blank{color:var(--yama);border-bottom:2px solid var(--yama);padding:0 20px}
.qtag{display:inline-block;font-size:10px;letter-spacing:.14em;font-weight:800;
  padding:4px 9px;border-radius:20px;background:var(--bord);color:var(--dim);margin-bottom:12px}

.explain{margin-top:14px;background:var(--surf);border:1px solid var(--bord);
  border-radius:11px;padding:15px;font-size:14px;line-height:1.7}
.explain h4{margin:0 0 7px;font-size:12px;letter-spacing:.14em;color:var(--mura)}

/* ── progress / HP ─────────────────────────────────── */
.hp{height:14px;background:var(--surf2);border:2px solid var(--ink);border-radius:3px;
  overflow:hidden;display:flex}
.hp i{display:block;height:100%;background:var(--mura);transition:width .35s}
.hp.boss i{background:var(--coral)}
.counter{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
  margin-bottom:7px;font-weight:700;letter-spacing:.1em}

/* ── mastery wall (grid of genkoyoshi cells) ───────── */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.cell{aspect-ratio:1;border:1px solid var(--bord);border-radius:2px;display:grid;
  place-items:center;font-family:var(--jp);font-size:18px;color:var(--dim);
  background:var(--surf)}
.cell.b1{color:var(--txt)}
.cell.b2{background:var(--yama-dim);border-color:var(--yama);color:var(--yama)}
.cell.b3{background:var(--mura-dim);border-color:var(--mura);color:var(--mura)}
.cell.b4{background:var(--mura-btn);border-color:var(--mura-btn);color:#fff}
.cell.b5{background:var(--paper);border-color:var(--paper);color:var(--ink)}

.stat{display:flex;gap:10px;margin-bottom:14px}
.stat>div{flex:1;background:var(--surf);border:1px solid var(--bord);border-radius:12px;
  padding:12px 10px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:23px;font-weight:800;color:var(--yama)}
.stat span{font-size:10px;letter-spacing:.12em;color:var(--dim);font-weight:700}

/* ── bottom nav ────────────────────────────────────── */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(25,18,49,.97);
  backdrop-filter:blur(12px);border-top:2px solid var(--bord);
  display:flex;padding:8px 4px calc(8px + var(--safe-b))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:5px 2px;color:var(--dim);border-radius:10px}
nav button .ic{font-family:var(--jp);font-size:19px;font-weight:700;line-height:1;
  padding:5px 14px;border-radius:10px;transition:background .2s}
nav button .lb{font-size:9px;letter-spacing:.08em;font-weight:700}
nav button.on{color:var(--mura)}
nav button.on .ic{background:var(--mura-dim)}

.toast{box-shadow:0 6px 22px rgba(0,0,0,.5);position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%);
  background:var(--paper);color:var(--ink);padding:11px 18px;border-radius:10px;
  font-weight:800;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;
  transition:.3s;white-space:nowrap;max-width:90vw;overflow:hidden}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

.msrow{background:var(--surf);border:1px solid var(--bord);border-left:3px solid var(--coral);
  border-radius:0 12px 12px 0;padding:14px;margin-bottom:12px}
.mstag{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--coral)}
.msq{font-family:var(--jp);font-size:17px;line-height:1.7;margin:7px 0}
.msans{font-size:13px;line-height:1.6;margin-top:4px}
.msans .x{color:var(--coral)}.msans .o{color:var(--ok)}
.dots{display:flex;gap:5px;align-items:center;margin-top:9px;font-size:11px;color:var(--dim)}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--bord);display:block}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.serifu{margin-top:11px;background:var(--mura-dim);border-radius:10px;padding:11px 13px}
.serifu .lbl{font-size:9.5px;letter-spacing:.2em;font-weight:800;color:var(--mura)}
.serifu .jp{font-family:var(--jp);font-size:18px;line-height:1.6;margin:6px 0 4px}
.serifu .tr{font-size:12.5px;color:var(--dim);line-height:1.5}
.d50{background:var(--surf);border:2px solid var(--yama);border-radius:16px;
  padding:18px;margin-bottom:14px}
.d50 h2{font-size:19px;color:var(--yama)}
.d50 .big{font-family:var(--disp);font-size:40px;font-weight:800;line-height:1;color:var(--txt)}
.d50 .big small{font-size:15px;color:var(--dim);font-weight:700}
.d50 .mix{font-size:11.5px;color:var(--dim);margin-top:9px;letter-spacing:.02em}
.meigen{background:var(--surf);border:1px solid var(--bord);border-top:3px solid var(--yama);
  border-radius:0 0 14px 14px;padding:16px;margin-bottom:14px}
.meigen .jp{font-family:var(--jp);font-size:21px;line-height:1.65;font-weight:700}
.meigen .rd{font-family:var(--jp);font-size:12.5px;color:var(--mura);margin-top:5px}
.meigen .src{font-size:11px;color:var(--dim);margin-top:8px;letter-spacing:.04em}
.meigen .mn{font-size:13px;line-height:1.6;margin-top:11px;padding-top:11px;
  border-top:1px dashed var(--bord);color:var(--txt)}
.meigen .tr{font-size:13.5px;color:var(--yama);margin-top:7px;font-weight:700}
#cheer{position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  pointer-events:none;opacity:0;transition:opacity .22s}
#cheer.on{opacity:1;pointer-events:auto;background:rgba(25,18,49,.72);
  backdrop-filter:blur(3px)}
.cheerbox{background:var(--surf);border:2px solid var(--mura);border-radius:20px;
  padding:22px 26px;text-align:center;max-width:min(320px,86vw);
  box-shadow:0 14px 44px rgba(0,0,0,.55);animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.cheerbox.big{border-color:var(--yama)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.sprite{display:block;margin:0 auto 12px;animation:hop .62s steps(2,end) infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.cheertxt{margin:0;font-size:16.5px;font-weight:800;line-height:1.45;color:var(--txt)}
.cheersub{margin:8px 0 0;font-size:12.5px;color:var(--yama);font-weight:700;
  letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){.sprite{animation:none}}
.muted{color:var(--dim);font-size:13.5px;line-height:1.65}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.1em;
  padding:4px 10px;border-radius:20px;border:1px solid var(--bord);color:var(--dim);
  margin:0 6px 6px 0}
.pill.on{background:var(--mura-btn);border-color:var(--mura-btn);color:#fff}
select,input[type=date]{background:var(--surf);border:1.5px solid var(--bord);color:var(--txt);
  padding:11px;border-radius:10px;font-family:inherit;font-size:14px;width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yama);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="days"><span id="dLeft">—</span><small id="dLabel">DIAS ATÉ O EXAME</small></div>
  <div class="topmeta">
    <div><span id="lvlL">Nível</span> <b id="lvl">1</b> · <span id="streak">0</span>🔥</div>
    <div class="xpbar"><i id="xpFill" style="width:0%"></i></div>
  </div>
  <button id="langBtn" class="langtog">PT</button>
</div>


<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-dojo"></section>
  <section class="view" id="v-mondai"></section>
  <section class="view" id="v-trap"></section>
  <section class="view" id="v-miss"></section>
  <section class="view" id="v-stats"></section>
</main>

<nav>
  <button data-v="home" class="on"><span class="ic">家</span><span class="lb">HOJE</span></button>
  <button data-v="dojo"><span class="ic">道</span><span class="lb">DOJO</span></button>
  <button data-v="mondai"><span class="ic">問</span><span class="lb">EXAME</span></button>
  <button data-v="trap"><span class="ic">罠</span><span class="lb">ARMADILHA</span></button>
  <button data-v="miss"><span class="ic">誤</span><span class="lb" id="nb4">ERROS</span></button>
  <button data-v="stats"><span class="ic">録</span><span class="lb" id="nb5">DADOS</span></button>
</nav>

<div id="cheer"></div>
<div class="toast" id="toast"></div>
<script>
/* ═══════════════ 漢字 · KANJI N2 ═══════════════ */
const KANJI=[
{c:'略',on:'リャク',kun:'—',pt:'abreviar, estratégia',en:'abbreviate, strategy',mn:'田 (campo) + 各 (cada) → o general desenha <b>cada campo</b> num mapa curto: uma <b>estratégia abreviada</b>.',w:[['略語','りゃくご','sigla / abbreviation'],['省略','しょうりゃく','omissão / omission'],['戦略','せんりゃく','estratégia / strategy']]},
{c:'承',on:'ショウ',kun:'うけたまわ(る)',pt:'consentir, receber (humilde)',en:'consent, receive',mn:'Uma mão erguida recebendo uma ordem de cima. Você <b>aceita</b> o que o chefe manda — por isso é linguagem humilde.',w:[['承知','しょうち','estar ciente / acknowledge'],['了承','りょうしょう','aprovação / consent'],['継承','けいしょう','sucessão / succession']]},
{c:'締',on:'テイ',kun:'し(める)',pt:'apertar, fechar (prazo)',en:'tighten, close',mn:'糸 (fio) + 帝 (imperador) → o imperador <b>aperta</b> o cinto com fio. 締め切り = prazo que se <b>fecha</b>.',w:[['締切','しめきり','prazo / deadline'],['締結','ていけつ','celebrar (contrato) / conclude']]},
{c:'被',on:'ヒ',kun:'こうむ(る)',pt:'sofrer, ser afetado',en:'suffer, incur',mn:'衤(roupa) + 皮 (pele) → vestir algo sobre a pele = <b>receber sobre si</b>. Sempre aparece em desastres: 被害.',w:[['被害','ひがい','danos / damage'],['被災者','ひさいしゃ','vítima / victim']]},

/* ═══ 罠 · ARMADILHAS DE TRADUÇÃO LITERAL (PT/EN → JP) ═══ */
const TRAPS=[
{pt:'Meu amigo me deu um presente.',en:'My friend gave me a present.',
 o:['友だちがプレゼントをあげました','友だちがプレゼントをくれました','友だちにプレゼントをもらいました','友だちがプレゼントをやりました'],a:1,
 why:'PT tem <b>um</b> verbo "dar"; o japonês tem dois. <span class="o">くれる</span> = alguém dá <b>para mim / para o meu lado</b>. <span class="x">あげる</span> = eu dou para fora. Se o presente vem na sua direção e o sujeito é o amigo → sempre <b>くれる</b>. (もらう também é correto, mas muda o sujeito para 私: 私は友だちにもらった.)'},
{pt:'Eu conheço o Tanaka.',en:'I know Tanaka.',
 o:['田中さんを知ります','田中さんを知っています','田中さんを知りました','田中さんが知っています'],a:1,
 why:'知る no presente simples <b>não existe</b> com esse sentido. 知っている não é "estou sabendo" (o ている aqui é <b>estado</b>, não progressivo). Mesma família: 住んでいる (moro), 結婚している (sou casado), 持っている (tenho).'},
{pt:'Tem um gato debaixo da mesa.',en:'There is a cat under the table.',
 o:['テーブルの下に猫があります','テーブルの下に猫がいます','テーブルの下は猫がいます','テーブルの下で猫がいます'],a:1,
 why:'O PT usa "ter/haver" para tudo. O japonês separa: <b>いる</b> = seres vivos que se movem, <b>ある</b> = objetos. E o lugar de existência leva <b>に</b>, nunca で (で = onde uma <b>ação</b> acontece).'},
{pt:'A porta abriu (sozinha).',en:'The door opened.',
 o:['ドアを開けました','ドアが開きました','ドアが開けました','ドアを開きました'],a:1,
 why:'PT usa o mesmo verbo "abrir" para os dois casos. Japonês tem <b>pares</b>: 開ける (eu abro, leva を) / 開く (abre-se, leva が). Estude em pares: 閉める・閉まる / 始める・始まる / 入れる・入る / 落とす・落ちる / 決める・決まる.'},
{pt:'Eu gosto de você.',en:'I like you.',
 o:['君を好きです','君が好きです','君に好きです','君は好きます'],a:1,
 why:'好き é <b>adjetivo な</b>, não verbo. Literalmente "você é agradável (para mim)" — por isso o objeto leva <b>が</b>. Mesma regra: 上手・下手・分かる・できる・要る・ほしい todos levam が.'},
{pt:'Ele quer ir ao Japão.',en:'He wants to go to Japan.',
 o:['彼は日本に行きたいです','彼は日本に行きたがっています','彼は日本に行きたいだ','彼が日本に行きほしい'],a:1,
 why:'～たい só para <b>a própria</b> vontade (ou pergunta direta). Para terceiros: ～たがっている, ～たいそうです ou ～たいようです. O japonês não deixa você afirmar o coração alheio.'},
{pt:'Não é muito caro.',en:'It\'s not very expensive.',
 o:['とても高くないです','あまり高くないです','たくさん高くないです','ずいぶん高くないです'],a:1,
 why:'とても só combina com <b>afirmativo</b>. Com negativo o par obrigatório é <b>あまり</b>. Outros pares fixos: ぜんぜん＋negativo, めったに＋negativo, 必ずしも＋negativo.'},
{pt:'Emprestei meu carro para ele.',en:'I lent him my car.',
 o:['彼に車を借りました','彼に車を貸しました','彼から車を貸しました','彼に車を借してもらいました'],a:1,
 why:'⚠ ARMADILHA PORTUGUESA: "emprestar" em PT serve para <b>dar</b> e <b>pegar</b>. Japonês separa: <b>貸す</b> = eu dou emprestado. <b>借りる</b> = eu pego emprestado. Truque: 貸す tem す de "サービス" (eu sirvo).'},
{pt:'Aprendi japonês com o professor Sato.',en:'I learned Japanese from Prof. Sato.',
 o:['佐藤先生に日本語を教えました','佐藤先生に日本語を習いました','佐藤先生が日本語を習いました','佐藤先生で日本語を教わりました'],a:1,
 why:'教える = ensinar (eu passo). 習う/教わる = aprender (eu recebo). Mesma lógica de 貸す/借りる. A partícula に marca <b>a fonte</b> aqui.'},
{pt:'Estou usando óculos e um chapéu.',en:'I\'m wearing glasses and a hat.',
 o:['めがねを着て、帽子を着ています','めがねをかけて、帽子をかぶっています','めがねをはいて、帽子を着ています','めがねをつけて、帽子をはいています'],a:1,
 why:'"Usar/vestir" vira 5 verbos: <b>着る</b> (tronco), <b>はく</b> (pernas/pés), <b>かぶる</b> (cabeça), <b>かける</b> (óculos), <b>する</b> (acessórios: 時計・ネクタイ・指輪).'},
{pt:'Se chover, não vou.',en:'If it rains, I won\'t go.',
 o:['雨が降ると、行きません','雨が降ったら、行きません','雨が降れば、行きません','雨が降るなら、行きません'],a:1,
 why:'PT tem só "se". Japonês tem 4. <b>と</b> = consequência automática, proíbe vontade/negação na 2ª parte. <b>たら</b> = o mais livre, aceita intenção → é o certo aqui. <b>ば</b> = condição genérica, evita com verbos de ação+intenção. <b>なら</b> = "se é o caso de", reage ao que o outro disse.'},
{pt:'Vou estudar para passar no exame.',en:'I\'ll study in order to pass the exam.',
 o:['合格するために勉強します','合格するように勉強します','合格するのに勉強します','合格するので勉強します'],a:0,
 why:'<b>ために</b> = objetivo que <b>eu controlo</b> (verbo volitivo). <b>ように</b> = objetivo <b>fora do meu controle</b> ou com potencial/negativo: 合格できるように, 忘れないように. Roberto: 「合格するために」e「合格できるように」ambas existem — a diferença é o verbo.'},
{pt:'Quando eu for ao Japão, quero comprar isso.',en:'When I go to Japan, I want to buy this.',
 o:['日本に行った時、これを買いたい','日本に行く時、これを買いたい','日本に行っている時、これを買いたい','日本に行くの時、これを買いたい'],a:1,
 why:'O tempo dentro de 時 é <b>relativo à ação principal</b>, não à realidade. 行く時 = antes/no caminho (compra ainda não fez a viagem). 行った時 = já chegou. Se você compra <b>no Japão</b>, o correto é 日本に行った時. Aqui, "comprar isso" = souvenir antes de embarcar → 行く時. Leia sempre a lógica, não traduza o "quando".'},
{pt:'Está frio, não está? / né?',en:'It\'s cold, isn\'t it?',
 o:['寒いですね','寒いですか','寒くないですか','寒いでしょうか'],a:0,
 why:'ね busca <b>concordância compartilhada</b>. Não confunda com よ (informar algo novo) nem com か (pergunta real). Erro comum de europeu: usar か demais, o que soa a interrogatório.'},
{pt:'Você não vem? — Não, eu vou.',en:'Aren\'t you coming? — No, I am.',
 o:['はい、行きます','いいえ、行きます','はい、行きません','ええ、行きません'],a:1,
 why:'Em japonês はい/いいえ respondem à <b>proposição da pergunta</b>, igual ao PT aqui — mas cuidado no inverso: 「行かないんですか」→「はい、行きません」= "Isso, não vou". O EN "yes" faria você errar. Sempre confirme: はい = "sua frase está certa".'},
{pt:'Consigo ver o mar da janela.',en:'I can see the sea from the window.',
 o:['窓から海が見られます','窓から海が見えます','窓から海を見えます','窓から海が見ます'],a:1,
 why:'<b>見える</b> = entra nos olhos espontaneamente (potencial natural). <b>見られる</b> = tenho a possibilidade/permissão de assistir. Par idêntico: 聞こえる (ouço sem querer) vs 聞ける (posso escutar).'},
{pt:'Ontem, muito obrigado.',en:'Thank you for yesterday.',
 o:['昨日はありがとうございます','昨日はありがとうございました','昨日はありがとうです','昨日でありがとうございました'],a:1,
 why:'Ação <b>concluída</b> → forma passada ございました. Usar o presente para algo de ontem soa desatento. Igual: すみませんでした, ごちそうさまでした.'},
{pt:'Fui obrigado a esperar duas horas pelo chefe.',en:'I was made to wait two hours by my boss.',
 o:['部長は二時間待たせました','部長に二時間待たされました','部長に二時間待ちました','部長が二時間待たれました'],a:1,
 why:'<b>Causativo-passivo</b> (させられる): eu fui forçado e não gostei. 待つ→待たせる→待たされる. Português precisa de perífrase ("fui obrigado a"); japonês resolve num verbo. Aparece muito no N2.'},
{pt:'Choveu (e isso me atrapalhou).',en:'It rained on me.',
 o:['雨が降りました','雨に降られました','雨を降らせました','雨が降らされました'],a:1,
 why:'<b>Passiva de sofrimento</b> (迷惑の受身) — não existe em PT nem EN. 降られる = a chuva caiu e me prejudicou. Outros: 友だちに来られて勉強できなかった / 子供に泣かれた.'},
{pt:'Estou com saudade de casa.',en:'I miss home.',
 o:['家が寂しいです','家が恋しいです','家をミスします','家が懐かしいです'],a:1,
 why:'"Saudade" não tem equivalente único. <b>恋しい</b> = sinto falta de algo/lugar. <b>懐かしい</b> = nostalgia calorosa do passado. <b>会いたい</b> = sinto falta de uma pessoa. <b>寂しい</b> = eu me sinto sozinho. Escolha pelo foco, nunca traduza direto.'},
{pt:'Ele disse que vem amanhã.',en:'He said he\'s coming tomorrow.',
 o:['彼は明日来ると思います','彼は明日来るそうです','彼は明日来そうです','彼は明日来るようです'],a:1,
 why:'<b>そうです</b> após forma simples = <b>ouvi dizer</b>. Após ます形/adjetivo = <b>parece que vai</b> (雨が降りそう). Duas gramáticas, uma aparência. O N2 adora testar isso.'},
{pt:'Deixei a janela aberta (de propósito).',en:'I left the window open.',
 o:['窓が開いています','窓を開けています','窓が開けてあります','窓を開けました'],a:2,
 why:'<b>てある</b> = alguém fez de propósito e o resultado permanece (com が). <b>ている</b> com intransitivo = estado natural. 開いている = está aberta (sem falar de agente). 開けてある = alguém deixou aberta com intenção.'},
{pt:'Vou fazer a lição antes que eu esqueça.',en:'I\'ll do it before I forget.',
 o:['忘れる前にやっておきます','忘れないうちにやっておきます','忘れてからやっておきます','忘れるまでやっておきます'],a:1,
 why:'<b>～ないうちに</b> = enquanto ainda não acontece. 前に também existiria, mas ないうちに é o que o N2 cobra e carrega o senso de "aproveitar a janela". Compare: 暗くならないうちに帰ろう.'},
{pt:'Só me resta desistir.',en:'I have no choice but to give up.',
 o:['諦めるしかない','諦めるべきだ','諦めなければならない','諦めるはずだ'],a:0,
 why:'O EN "have to / must" cobre 4 estruturas distintas: <b>しかない</b> (só resta), <b>なければならない</b> (regra externa), <b>べきだ</b> (dever moral), <b>ざるを得ない</b> (sem alternativa, formal). Não são intercambiáveis.'},
{pt:'Ele não deve ter vindo — o carro não está aqui.',en:'He must not have come — the car isn\'t here.',
 o:['彼は来なかったに違いない','彼は来ないべきだ','彼は来ないはずがない','彼は来まい'],a:0,
 why:'Dedução forte sobre o <b>passado</b> → 過去形 + に違いない. Erro típico: usar べき (dever) para dedução, por causa do "must" do inglês.'},
{pt:'Este livro é fácil de ler.',en:'This book is easy to read.',
 o:['この本は読むが易しい','この本は読みやすい','この本は読むのが易しい','この本は読めやすい'],a:1,
 why:'<b>ます形 + やすい/にくい</b> forma um adjetivo novo. 読みやすい, 使いにくい, 分かりやすい. Traduzir "fácil de" com 易しい dá frase pesada e antinatural.'},
{pt:'Eu, eu acho que eu vou eu mesmo.',en:'I think I\'ll go myself.',
 o:['私は私が私で行くと私は思います','自分で行こうと思います','私は自分は行くと思っています','私が私自身行きます'],a:1,
 why:'PT e EN repetem o sujeito; japonês <b>apaga</b> tudo que o contexto já dá. Excesso de 私 soa infantil ou agressivo. Regra do N2: se dá pra omitir, omita.'},
{pt:'Trabalho numa empresa japonesa há 3 anos.',en:'I\'ve worked at a Japanese company for 3 years.',
 o:['三年間日本の会社で働きます','三年前から日本の会社で働いています','三年間日本の会社で働きました','三年から日本の会社に働いています'],a:1,
 why:'Ação que começou no passado e <b>continua</b> → ている. O presente simples 働きます seria hábito futuro. E empresa como <b>local de ação</b> leva で (に só com 勤める).'},
{pt:'Vou ver se ele está bem.',en:'I\'ll check if he\'s okay.',
 o:['彼が大丈夫かどうか見てみます','彼は大丈夫があるか見ます','彼が大丈夫だと見てみます','彼が大丈夫なら見てみます'],a:0,
 why:'"Se" de <b>dúvida indireta</b> = かどうか (nunca もし/たら). E ～てみる = experimentar/verificar. Dois pontos que aparecem juntos com frequência no N2.'},
{pt:'Acabei comendo tudo.',en:'I ended up eating it all.',
 o:['全部食べ終わりました','全部食べてしまいました','全部食べておきました','全部食べています'],a:1,
 why:'<b>てしまう</b> ≠ "terminar de". Carrega <b>arrependimento</b> ou conclusão irreversível — exatamente o PT "acabar por". 食べ終わる seria neutro ("terminei de comer"). Na fala: 食べちゃった.'}
];

/* ═══ 過去問 · QUESTÕES ESTILO JLPT N2 ═══ */
const MONDAI=[
{s:'文法',q:'この問題は難しいので、先生に相談した＿決めたほうがいい。',o:['上で','上に','末に','うえは'],a:0,ex:'<b>～た上で</b> = fazer A e, <b>com base nisso</b>, decidir B. 上に = "além de". 末に = "depois de muito...(esforço)". Aqui a consulta fundamenta a decisão.'},
{s:'文法',q:'彼は学生である＿、会社を経営している。',o:['一方で','ながらも','おかげで','からには'],a:1,ex:'<b>ながらも</b> = concessivo ("embora seja"). 一方で existe mas exige contraste entre dois lados, não entre status e ação da mesma pessoa. Cuidado: este ながら não é "enquanto".'},
{s:'文法',q:'部長が戻り＿、すぐにご連絡いたします。',o:['次第','とたん','うちに','かぎり'],a:0,ex:'<b>ます形＋次第</b> = "assim que", só para <b>futuro</b>. とたん exige passado. Note que 次第 depois de <b>substantivo</b> significa "depende de" — função totalmente diferente.'},
{s:'文法',q:'一度約束した＿、必ず守るべきだ。',o:['ものの','からには','わりに','ばかりに'],a:1,ex:'<b>からには</b> = "já que (fez), então naturalmente...". Sempre seguido de dever/determinação (べき・つもり・なければならない).'},
{s:'文法',q:'この機械は操作が複雑で、素人には扱い＿。',o:['かねない','かねる','がたい','ようがない'],a:2,ex:'<b>ます形＋がたい</b> = difícil de fazer (psicológica ou praticamente). かねる seria recusa educada de atendimento; かねない significa "pode acabar acontecendo (algo ruim)".'},
{s:'文法',q:'努力もし＿、いい結果を求めるのは無理だ。',o:['ないで','ずに','ないことには','なくて'],a:2,ex:'<b>ないことには</b> = "se não fizer, não dá". A oração final <b>precisa</b> ser negativa — 無理だ cumpre isso.'},
{s:'文法',q:'彼女は寂しさ＿、毎日電話をかけてきた。',o:['のあまり','のうえ','のもとで','のせいで'],a:0,ex:'<b>N のあまり</b> = "de tanto (emoção)". Só com substantivos de sentimento intenso: 悲しみ・喜び・驚き・心配.'},
{s:'文法',q:'雨が降ろうが降る＿、試合は行われる。',o:['まいが','ないが','ものが','ずが'],a:0,ex:'<b>～うが～まいが</b> = "quer... quer não". まい é a negativa volitiva clássica. Padrão fixo do N2.'},
{s:'文法',q:'この地域では、伝統的な祭りが今も行われ＿。',o:['つつある','つつ','ている一方','かけている'],a:0,ex:'Cuidado: 行われている seria o natural. Mas entre as opções, <b>つつある</b> indica processo em curso. Note que つつある prefere verbos de <b>mudança</b> (増える・減る・変わる) — questões assim testam se você lê o verbo, não só a gramática.'},
{s:'文法',q:'今の実力＿、合格は難しいだろう。',o:['からして','からには','として','にとって'],a:0,ex:'<b>N からして</b> = "a julgar por / já a começar por". からには exige determinação depois. として = "na qualidade de".'},
{s:'文法',q:'テストの結果＿、クラスが決まります。',o:['次第で','次第に','しだいでは','に次第'],a:0,ex:'<b>N 次第で</b> = "depende de / conforme". 次第に (advérbio) = "gradualmente". Mesma palavra, três usos — o N2 explora isso.'},
{s:'文法',q:'彼の説明は、専門家＿分かりにくかった。',o:['にとっても','に対しても','についても','として'],a:0,ex:'<b>にとって</b> = do ponto de vista de (com avaliação: 分かりにくい). に対して seria "direcionado ao especialista". Este é o erro nº1 de falantes de línguas latinas.'},
{s:'文法',q:'子供＿、大人でもこのゲームは楽しめる。',o:['のみならず','をはじめ','に限らず','どころか'],a:2,ex:'<b>に限らず</b> = "não se limitando a". のみならず também caberia semanticamente, mas exige forma 普通形 ou N＋のみならず — aqui ambas funcionam; に限らず é a resposta mais natural com 「でも」na segunda parte.'},
{s:'文法',q:'彼が犯人である＿ない。証拠がそろっている。',o:['わけでは','に違い','はずが','ものでは'],a:1,ex:'<b>に違いない</b> = certeza forte. わけではない negaria; はずがない diria que é impossível. Leia a segunda frase (as provas existem) para escolher a polaridade.'},
{s:'文法',q:'この薬を飲め＿、すぐに熱が下がるというものでもない。',o:['ば','たら','と','なら'],a:0,ex:'Padrão fixo <b>～ばというものでもない</b> = "não é que basta fazer X". Com たら/と a colocação quebra.'},
{s:'文法',q:'留学し＿、語学力だけでなく視野も広がった。',o:['たとたん','たおかげで','たばかりに','てはじめて'],a:1,ex:'<b>おかげで</b> = graças a (resultado <b>bom</b>). ばかりに exige resultado ruim; とたん exige evento instantâneo e surpreendente.'},
{s:'文法',q:'締め切りが近いので、休んでいる＿。',o:['ものではない','わけにはいかない','ようがない','ほかならない'],a:1,ex:'<b>わけにはいかない</b> = não posso me dar ao luxo (impedimento moral/circunstancial), não incapacidade física.'},
{s:'文法',q:'値段が高い＿、品質は期待外れだった。',o:['わりに','だけに','からこそ','ばかりに'],a:0,ex:'<b>わりに</b> = "para o que se esperaria". だけに daria resultado <b>coerente</b> com a expectativa (高いだけに品質もいい).'},
{s:'語彙',q:'彼の意見は＿で、賛成も反対もしにくい。',o:['あいまい','てきとう','じみ','むだ'],a:0,ex:'<b>あいまい</b> = vago/ambíguo. 適当 tem duplo sentido (apropriado / feito de qualquer jeito) e não cabe aqui.'},
{s:'語彙',q:'この仕事は経験が＿なので、新人には無理だ。',o:['欠かせない','足りない','required','余る'],a:0,ex:'<b>欠かせない</b> = indispensável. Vem de 欠く (faltar) + potencial negativo = "não se pode deixar faltar".'},
{s:'語彙',q:'台風の＿で、電車が止まった。',o:['影響','効果','結果','原因'],a:0,ex:'<b>影響</b> = influência (algo externo afeta). 効果 = efeito desejado de uma ação. 原因 seria a causa em si: 台風が原因で também é possível — mas com <b>の＿で</b> o encaixe natural é 影響.'},
{s:'語彙',q:'彼女は約束を＿、二度と信用されなくなった。',o:['裏切って','断って','失って','逃して'],a:0,ex:'<b>裏切る</b> = trair (expectativa/confiança). Colocação fixa: 期待を裏切る・信頼を裏切る.'},
{s:'語彙',q:'食生活が＿と、健康に悪い。',o:['偏る','傾く','曲がる','ずれる'],a:0,ex:'<b>偏る</b> = desequilibrar-se, ser tendencioso (nutrição, opinião). 傾く é inclinar-se fisicamente ou tendência geral (傾向).'},
{s:'語彙',q:'この店は素材に＿いる。',o:['こだわって','かかわって','関して','基づいて'],a:0,ex:'<b>こだわる</b> = ser exigente/obcecado por (em contexto positivo hoje). 関わる = estar envolvido.'},
{s:'語彙',q:'彼は責任を＿、辞任した。',o:['果たさずに','守らずに','終わらずに','済まさずに'],a:0,ex:'Colocação fixa: <b>責任を果たす</b> = cumprir a responsabilidade. Memorize verbos por par com o substantivo, não isolados.'},
{s:'語彙',q:'先生に＿された通りに書きました。',o:['指示','指導','命令','注文'],a:0,ex:'<b>指示</b> = instrução concreta. 指導 = orientação prolongada. 命令 é ordem (militar/hierárquica forte). 注文 = pedido em loja.'},
{s:'類義',q:'「今年こそ合格したい」に最も近いのは：',o:['今年は必ず合格したい','今年も合格したい','今年しか合格できない','今年だけ合格したい'],a:0,ex:'<b>こそ</b> = ênfase de "desta vez sim" (implica tentativas anteriores). Não é だけ (só) nem も (também).'},
{s:'類義',q:'「彼の話は信じがたい」に最も近いのは：',o:['信じるのが難しい','信じてはいけない','信じるはずがない','信じたくない'],a:0,ex:'<b>～がたい</b> = difícil de fazer. Não é proibição nem desejo.'},
{s:'類義',q:'「雨に降られて、服がぬれた」に最も近いのは：',o:['雨が降って困った','自分で雨を降らせた','雨を待っていた','雨が降りそうだった'],a:0,ex:'Passiva de <b>sofrimento</b>: o falante foi prejudicado pelo evento. PT precisa de "acabei pegando chuva".'},
{s:'類義',q:'「参加するかしないかは君次第だ」に最も近いのは：',o:['君が決めることだ','君は参加すべきだ','君は参加できない','君も参加する'],a:0,ex:'<b>N次第だ</b> = depende de N. Aqui a decisão é do interlocutor.'},
{s:'類義',q:'「彼が来るわけがない」に最も近いのは：',o:['彼は絶対に来ない','彼は来ないかもしれない','彼は来なくてもいい','彼は来ないことにした'],a:0,ex:'<b>わけがない</b> = 0% de possibilidade. Compare com わけではない ("não é bem que...").'},
{s:'並べ替え',q:'この映画は　子供　＿　＿　★　＿　人気がある。【★に入るのは？】',o:['に','限らず','大人','にも'],a:2,ex:'Ordem correta: 子供【に】【限らず】【大人】【にも】人気がある。→ ★ (3ª lacuna) = <b>大人</b>.<br>Método do 並べ替え: <b>não tente preencher da esquerda para a direita</b>. Ache primeiro o bloco fixo (aqui 「に限らず」), cole-o, e o resto se encaixa sozinho.'},
{s:'並べ替え',q:'努力　＿　＿　★　＿　結果は出ないだろう。【★に入るのは？】',o:['し','ない','ことに','は'],a:2,ex:'Ordem correta: 努力【し】【ない】【ことに】【は】結果は出ない。→ ★ = <b>ことに</b>.<br>Bloco fixo: 「～ないことには」. Confirme sempre a polaridade: a oração final é negativa (出ない), o que valida o padrão.'},
{s:'並べ替え',q:'この仕事は　＿　＿　★　＿　ものではない。【★に入るのは？】',o:['誰でも','簡単に','やれる','という'],a:2,ex:'Ordem correta: 誰でも【簡単に】【やれる】【という】ものではない。→ ★ = <b>やれる</b>.<br>Bloco fixo: 「～というものではない」= "não é que baste...". Encaixe o bloco no fim e monte para trás.'},
{s:'読解',p:'近年、日本では「働き方改革」が進められている。長時間労働を減らし、社員が自分の時間を持てるようにするのが目的だ。しかし、実際には仕事量が変わらないまま労働時間だけが短縮され、かえって社員の負担が増えたという声も少なくない。制度を変えるだけでなく、仕事の進め方そのものを見直さないかぎり、真の改革は難しいだろう。',
 q:'筆者が最も言いたいことは何か。',o:['労働時間を短くすれば改革は成功する','仕事の量ややり方を見直さなければ改革は実現しない','社員は自分の時間を持つべきではない','働き方改革はすでに成功している'],a:1,ex:'A chave está na última frase: <b>～ないかぎり…難しい</b> = "a menos que... será difícil". Em textos do N2, a <b>tese vem quase sempre no último período</b>, e conectores como しかし・かえって・～ないかぎり marcam a virada. Sublinhe-os antes de ler as alternativas.'},
{s:'読解',p:'外国語を学ぶとき、母語に訳して理解しようとする人は多い。確かに初級のうちは有効だ。しかし中級以上になると、この習慣がかえって上達を妨げることがある。言葉には、他の言語にそのまま置き換えられない使い分けが存在するからだ。訳すのではなく、その言葉が使われる場面ごと覚えることが求められる。',
 q:'筆者によると、中級以上の学習者に必要なのは何か。',o:['母語に正確に訳すこと','場面と一緒に言葉を覚えること','初級の勉強をやり直すこと','辞書を使わないこと'],a:1,ex:'Roberto — este texto é sobre <b>você</b>. 「訳すのではなく、場面ごと覚える」: não traduza, memorize a <b>situação</b>. Nota de leitura: 「かえって」sinaliza inversão da expectativa e quase sempre precede a tese do autor.'},
{s:'読解',p:'図書館の利用案内：本の貸出は一人五冊まで、期間は二週間です。ただし、他の利用者の予約が入っていない場合に限り、一回だけ延長できます。延長は返却日の前日までにカウンターまたはウェブサイトでお申し込みください。返却が遅れた場合、遅れた日数だけ次回の貸出ができなくなります。',
 q:'延長について、正しいものはどれか。',o:['何回でも延長できる','予約があっても延長できる','返却日の前日までに申し込む必要がある','電話でのみ申し込める'],a:2,ex:'Questões de <b>informação prática</b> (情報検索) se resolvem caçando as condições: 「一回だけ」「予約が入っていない場合に限り」「前日までに」「カウンターまたはウェブサイト」. Leia a pergunta <b>primeiro</b>, depois varra o texto atrás da condição — não leia tudo.'},
{s:'文法',q:'医者に言われた＿、お酒をやめることにした。',o:['ものだから','ものの','ものなら','ものか'],a:0,ex:'<b>ものだから</b> = "é que..." (justificativa). ものの seria concessivo; ものなら hipótese improvável; ものか negação enfática.'},
{s:'文法',q:'あの人に頼んだ＿、断られるに決まっている。',o:['ところで','ところが','ところに','ところを'],a:0,ex:'<b>Vた形＋ところで</b> = "mesmo que faça, não adianta". Sempre com resultado negativo/inútil.'},
{s:'文法',q:'先生のご都合を＿上で、日程を決めます。',o:['伺った','聞かれた','お聞きになった','うかがわれた'],a:0,ex:'<b>伺う</b> = forma humilde de 聞く (eu pergunto). お聞きになる seria honorífica (o professor pergunta) — erro clássico de inverter 尊敬語 e 謙譲語.'},
{s:'文法',q:'こちらの資料をご覧＿ください。',o:['になって','くださって','いただいて','に'],a:0,ex:'<b>ご覧になる</b> = honorífico de 見る. 「ご覧ください」também é correto; entre as opções, ご覧になってください é a forma completa aceitável.'},
{s:'語彙',q:'この製品は若者を＿にした商品だ。',o:['対象','対して','向き','相手'],a:0,ex:'<b>N を対象にする</b> = ter como público-alvo. Colocação fixa muito frequente em textos de negócios do N2.'},
{s:'語彙',q:'スマートフォンが＿したことで、生活が大きく変わった。',o:['普及','拡大','増加','発展'],a:0,ex:'<b>普及</b> = difundir-se amplamente entre a população (tecnologia, hábito). 拡大 = expandir em tamanho; 増加 = aumentar em número.'},
{s:'語彙',q:'塩分を＿ように医者に言われた。',o:['控える','抑える','止める','減らす'],a:0,ex:'<b>控える</b> = moderar/abster-se (saúde, consumo). 抑える = reprimir (emoção, custo). Ambas são "conter" em PT — a colocação decide.'},
{s:'類義',q:'「彼の努力を認めざるを得ない」に最も近いのは：',o:['認めないわけにはいかない','認めるつもりはない','認めるはずがない','認めてはいけない'],a:0,ex:'<b>ざるを得ない</b> ≒ <b>ないわけにはいかない</b>: ausência de alternativa. Este par aparece direto no 言い換え類義.'},
{s:'類義',q:'「三日間にわたって会議が行われた」に最も近いのは：',o:['三日間ずっと会議が続いた','三日目に会議があった','三日以内に会議がある','三日おきに会議がある'],a:0,ex:'<b>にわたって</b> = ao longo de toda a extensão. Não confunda com ～おきに (a cada intervalo) nem com ～以内 (dentro de).'}
];

/* ═══════════════ 文法 · GRAMMAR N3 ═══════════════ */
const GRAMMAR_N3=[
{g:'～ば～ほど',f:'V ば形 + V辞書形 + ほど',pt:'quanto mais... mais',en:'the more... the more',ex:'練習すればするほど上手になる。',tx:'Quanto mais você pratica, melhor fica.',trap:'O verbo se <b>repete</b>: 練習すれば練習するほど. Traduzir "quanto mais" com só ほど deixa a frase incompleta.'},
{g:'～たばかり',f:'V た形 + ばかり',pt:'acabou de',en:'just did',ex:'日本に来たばかりです。',tx:'Acabei de chegar ao Japão.',trap:'≠ ～たところ. <b>ばかり</b> é sentimento subjetivo de "faz pouco" (pode ser um mês). <b>たところ</b> é literalmente segundos atrás.'},
{g:'～ところだ',f:'V辞書形/ている/た + ところ',pt:'está prestes a / no meio de / acabou de',en:'about to / in the middle of / just finished',ex:'今から出かけるところです。',tx:'Estou saindo agora mesmo.',trap:'Três tempos, três significados: 出かける<b>ところ</b> (vou sair agora), 出かけている<b>ところ</b> (estou no meio disso), 出かけた<b>ところ</b> (acabei de sair). O N2 testa qual forma vem antes.'},
{g:'～ようになる',f:'V辞書形/ない形 + ようになる',pt:'passar a (mudança de capacidade/hábito)',en:'come to (do)',ex:'漢字が読めるようになった。',tx:'Passei a conseguir ler kanji.',trap:'Marca <b>mudança gradual</b>. Com verbo potencial é o padrão mais comum. 「読むようになった」= passei a ler (hábito); 「読めるようになった」= passei a conseguir ler. Não são iguais.'},
{g:'～ことにする / ことになる',f:'V辞書形/ない形 + ことにする',pt:'decidir / ficar decidido',en:'decide to / it is decided',ex:'来年留学することにしました。',tx:'Decidi estudar fora no ano que vem.',trap:'<b>する</b> = eu decidi. <b>なる</b> = foi decidido (por circunstância ou por outros). Japonês prefere なる mesmo quando a decisão foi sua — soa menos arrogante.'},
{g:'～らしい',f:'普通形 + らしい',pt:'parece que (ouvi/li)',en:'apparently',ex:'あの店は閉店したらしい。',tx:'Parece que aquela loja fechou.',trap:'Baseado em <b>informação externa</b>. Diferente de ようだ (sua própria observação) e de そうだ伝聞 (fonte citada). Também existe 男らしい = "másculo" — outro uso.'},
{g:'～みたいだ',f:'普通形(だ削除) + みたいだ',pt:'parece / tipo',en:'looks like / like',ex:'雨が降ったみたいだ。',tx:'Parece que choveu.',trap:'Versão <b>coloquial</b> de ようだ. Substantivo liga direto: 子供みたい (子供のようだ). Não use みたい em redação formal.'},
{g:'～そうだ (様態)',f:'Vます形 / Aい(い削除) + そうだ',pt:'parece que vai / tem cara de',en:'looks like it will',ex:'雨が降りそうだ。',tx:'Parece que vai chover.',trap:'⚠ Confusão nº1 do N3: 降り<b>そう</b> (parece que vai chover, eu vi o céu) vs 降る<b>そう</b> (ouvi dizer que vai chover). Forma ます = aparência; forma dicionário = boato. いい→よさそう, ない→なさそう (irregulares).'},
{g:'～そうだ (伝聞)',f:'普通形 + そうだ',pt:'dizem que',en:'I hear that',ex:'田中さんは来月結婚するそうだ。',tx:'Dizem que o Tanaka vai se casar mês que vem.',trap:'Nunca conjuga: 「降るそうでした」✗. Coloque o tempo <b>antes</b> de そうだ: 降ったそうだ.'},
{g:'～のに',f:'普通形 + のに',pt:'apesar de (com frustração)',en:'even though (with frustration)',ex:'約束したのに来なかった。',tx:'Apesar de ter prometido, não veio.',trap:'Carrega <b>insatisfação</b>. Nunca use com pedido ou intenção depois: 「寒いのにコートを着てください」✗ → use から/ので.'},
{g:'～ながら',f:'Vます形 + ながら',pt:'enquanto (mesma pessoa)',en:'while doing',ex:'音楽を聞きながら勉強する。',tx:'Estudo ouvindo música.',trap:'Só quando é a <b>mesma pessoa</b> fazendo as duas coisas ao mesmo tempo. A ação <b>principal</b> vem depois de ながら. Para duas pessoas diferentes use 間に.'},
{g:'～間に / ～間',f:'V ている/Nの + 間(に)',pt:'durante / enquanto',en:'while / during',ex:'寝ている間に地震があった。',tx:'Enquanto eu dormia, houve um terremoto.',trap:'<b>間に</b> = algo acontece num ponto dentro do período. <b>間</b> (sem に) = a ação dura o período todo. 留守の間に来た (veio em algum momento) vs 留守の間ずっと待った (esperou o tempo todo).'},
{g:'～うちに',f:'V ている/ない形/A + うちに',pt:'enquanto ainda',en:'while still',ex:'熱いうちに食べてください。',tx:'Coma enquanto ainda está quente.',trap:'Enfatiza que a <b>condição vai acabar</b> — aproveite a janela. 間に é neutro. 「若いうちに」= enquanto ainda é jovem.'},
{g:'～たびに',f:'V辞書形/Nの + たびに',pt:'toda vez que',en:'every time',ex:'この曲を聞くたびに国を思い出す。',tx:'Toda vez que ouço essa música, lembro do meu país.',trap:'Sempre <b>presente</b> antes de たびに, mesmo falando do passado.'},
{g:'～とおりに',f:'V辞書形/た形/Nの + とおりに',pt:'conforme, do jeito que',en:'as, just as',ex:'説明書のとおりに組み立てた。',tx:'Montei conforme o manual.',trap:'Substantivo leva の: 予想<b>どおり</b> (leitura muda para どおり quando cola direto no substantivo). 説明のとおり = 説明どおり.'},
{g:'～まま',f:'V た形/ない形/Nの/A + まま',pt:'deixando como está',en:'as it is, leaving it',ex:'窓を開けたまま出かけた。',tx:'Saí deixando a janela aberta.',trap:'Estado <b>não alterado</b>, geralmente com um toque de descuido. ≠ ておく (deixar de propósito para um fim). 靴のまま = de sapatos (sem tirar).'},
{g:'～ついでに',f:'V辞書形/た形/Nの + ついでに',pt:'já que está, aproveitando',en:'while I\'m at it',ex:'買い物のついでに郵便局に寄った。',tx:'Já que fui às compras, passei no correio.',trap:'A ação <b>principal</b> é a primeira; a de ついでに é secundária. Inverter soa estranho. Não é "ao mesmo tempo" (ながら).'},
{g:'～おかげで / ～せいで',f:'普通形/Nの + おかげで',pt:'graças a / por culpa de',en:'thanks to / because of (blame)',ex:'先生のおかげで合格できた。',tx:'Consegui passar graças ao professor.',trap:'<b>おかげで</b> só para resultado bom; <b>せいで</b> só para ruim. Português usa "por causa de" para os dois — em japonês isso vira erro de tom, não de gramática.'},
{g:'～ため(に)',f:'普通形/Nの + ため(に)',pt:'por causa de; para',en:'because of; in order to',ex:'台風のため、電車が止まった。',tx:'Por causa do tufão, os trens pararam.',trap:'Dois sentidos. Com <b>substantivo/passado</b> = causa. Com <b>verbo volitivo no dicionário</b> = objetivo. O contexto e a forma decidem. Registro mais formal que から/ので.'},
{g:'～によって',f:'N + によって',pt:'por (agente); dependendo de; através de',en:'by; depending on; by means of',ex:'人によって考え方が違う。',tx:'O modo de pensar varia de pessoa para pessoa.',trap:'Três usos. Na <b>passiva</b> marca o agente (発見された). Com "varia" significa "dependendo de". Não confunda com ために (objetivo).'},
{g:'～について',f:'N + について',pt:'sobre, a respeito de',en:'about, concerning',ex:'日本の文化について研究している。',tx:'Pesquiso sobre a cultura japonesa.',trap:'⚠ Só para <b>tema</b> de fala/pesquisa/pensamento. Não use para direção de uma ação — aí é に対して. Erro clássico de português: "sobre" e "para" viram a mesma coisa na cabeça.'},
{g:'～がる',f:'A語幹 + がる',pt:'demonstrar (sentimento de outro)',en:'show signs of (someone else\'s feeling)',ex:'子供が寒がっている。',tx:'A criança está com frio.',trap:'Adjetivos de <b>sentimento</b> (寒い・ほしい・怖い・うれしい) não podem ser afirmados de terceiros diretamente. 「彼は寒い」✗ → 彼は寒がっている. Regra que não existe em português.'},
{g:'～すぎる',f:'Vます形 / A語幹 + すぎる',pt:'demais',en:'too much',ex:'食べすぎてお腹が痛い。',tx:'Comi demais e estou com dor de barriga.',trap:'Sempre <b>negativo</b>. 「うれしすぎる」existe na fala jovem, mas na prova evite. いい→よすぎる, ない→なさすぎる.'},
{g:'～やすい / ～にくい',f:'Vます形 + やすい/にくい',pt:'fácil / difícil de',en:'easy / hard to',ex:'この靴は歩きやすい。',tx:'Esses sapatos são confortáveis de andar.',trap:'Vira <b>adjetivo い</b> e conjuga: 歩きやすかった, 歩きやすくない. Não escreva 「歩くのが易しい」— soa traduzido.'},
{g:'～はじめる / ～だす',f:'Vます形 + はじめる/だす',pt:'começar a',en:'begin to',ex:'突然雨が降りだした。',tx:'De repente começou a chover.',trap:'<b>だす</b> = início <b>súbito e involuntário</b>. <b>はじめる</b> = início neutro ou planejado. 「勉強しだす」soa estranho; 「泣きだす」é natural.'},
{g:'～ておく',f:'V て形 + おく',pt:'deixar feito (preparação)',en:'do in advance',ex:'会議の前に資料を読んでおく。',tx:'Vou ler o material antes da reunião.',trap:'⚠ Não é "colocar". É <b>preparação</b> ou <b>deixar assim de propósito</b>. Na fala vira ～とく: 買っとく.'},
{g:'～てみる',f:'V て形 + みる',pt:'experimentar fazer',en:'try doing',ex:'この料理を食べてみてください。',tx:'Experimente este prato.',trap:'≠ ～ようとする (tentar com esforço, podendo falhar). てみる é "faço para ver o que acontece". 「泳ごうとしたができなかった」vs 「泳いでみた」.'},
{g:'～ていく / ～てくる',f:'V て形 + いく/くる',pt:'ir seguindo / vir acontecendo',en:'go on doing / have been doing',ex:'これから寒くなっていくでしょう。',tx:'Daqui pra frente deve ir esfriando.',trap:'Eixo do <b>tempo</b>, não do espaço. <b>てくる</b> = do passado até agora (寒くなってきた). <b>ていく</b> = de agora para o futuro. Português não marca isso, então é fácil escolher errado.'},
{g:'～てあげる / ～てくれる / ～てもらう',f:'V て形 + あげる/くれる/もらう',pt:'fazer para alguém / alguém faz para mim',en:'do for someone / someone does for me',ex:'友だちが手伝ってくれた。',tx:'Meu amigo me ajudou.',trap:'⚠ O maior obstáculo para europeus. Em português "me ajudou" é neutro; em japonês <b>omitir くれる soa frio ou até rude</b>. 「友だちが手伝った」= relato distante. E てあげる para superiores soa condescendente — use お手伝いします.'},
{g:'～(ら)れる (受身)',f:'V ない形 + れる/られる',pt:'voz passiva',en:'passive',ex:'先生に名前を呼ばれた。',tx:'Fui chamado pelo professor.',trap:'O agente leva <b>に</b>, não によって (exceto em textos formais/criação). E a passiva japonesa costuma implicar que o falante foi <b>afetado</b> — é usada muito menos que em português.'},
{g:'～(さ)せる (使役)',f:'V ない形 + せる/させる',pt:'fazer/deixar alguém fazer',en:'make/let someone do',ex:'母は妹に部屋を掃除させた。',tx:'A mãe fez a irmã limpar o quarto.',trap:'Com verbo <b>transitivo</b> a pessoa leva に; com <b>intransitivo</b> leva を (子供を行かせる). E させてください = "deixe-me fazer" — pedido de permissão, muito usado no trabalho.'},
{g:'お～になる / お～する',f:'お + Vます形 + になる/する',pt:'honorífico / humilde',en:'honorific / humble',ex:'先生がお帰りになりました。',tx:'O professor já foi embora.',trap:'⚠ <b>になる</b> = o outro faz (respeito). <b>する</b> = eu faço (humildade). Inverter é o erro mais grave de 敬語 e cai direto na prova. 「お持ちします」= eu levo; 「お持ちになります」= o senhor leva.'},
{g:'～なければならない / ～なくてもいい',f:'V ない形 + ければならない',pt:'ter que / não precisar',en:'must / don\'t have to',ex:'明日までに出さなければならない。',tx:'Tenho que entregar até amanhã.',trap:'Na fala: なきゃ / なくちゃ. E cuidado com o par: <b>なくてもいい</b> = não precisa; <b>てはいけない</b> = não pode. Português "não tem que" é ambíguo entre os dois.'},
{g:'～てはいけない / ～てもいい',f:'V て形 + はいけない / もいい',pt:'não pode / pode',en:'must not / may',ex:'ここでたばこを吸ってはいけません。',tx:'Não se pode fumar aqui.',trap:'てはいけない é <b>proibição direta</b> — forte demais para dizer a um superior. Com chefe/cliente use ご遠慮ください.'},
{g:'～たほうがいい',f:'V た形 / ない形 + ほうがいい',pt:'é melhor',en:'had better',ex:'早く寝たほうがいいよ。',tx:'É melhor você dormir cedo.',trap:'Afirmativo usa a forma <b>た</b> (行ったほうがいい), negativo usa <b>ない</b> (行かないほうがいい). Usar 行くほうがいい muda o sentido para comparação de opções.'},
{g:'～ことがある',f:'V た形 + ことがある / V辞書形 + ことがある',pt:'já fez alguma vez / às vezes acontece',en:'have done before / sometimes happens',ex:'富士山に登ったことがあります。',tx:'Já subi o monte Fuji uma vez.',trap:'⚠ <b>た形</b> = experiência de vida. <b>辞書形</b> = ocorre ocasionalmente (電車が遅れることがある). Uma letra separa "já fiz" de "às vezes acontece".'},
{g:'～ないで / ～なくて',f:'V ない形 + で / なくて',pt:'sem fazer / por não fazer',en:'without doing / because not',ex:'朝ご飯を食べないで出かけた。',tx:'Saí sem tomar café da manhã.',trap:'<b>ないで</b> = sem fazer (ação simultânea) ou "em vez de". <b>なくて</b> = causa ("por não haver..."). 分からなくて困った ✓ / 分からないで困った ✗.'},
{g:'～し',f:'普通形 + し',pt:'e além disso (razões)',en:'and besides',ex:'安いし、おいしいし、この店が一番だ。',tx:'É barato, é gostoso — essa loja é a melhor.',trap:'Enumera <b>razões</b>, não ações em sequência. Para sequência use て形. Costuma vir em par (～し、～し).'},

{g:'～という',f:'N + という + N',pt:'chamado, que se chama',en:'called, named',ex:'「雪国」という小説を読んだ。',tx:'Li um romance chamado "Yukiguni".',trap:'Usa-se quando o ouvinte <b>não conhece</b> o nome. Também introduz conteúdo: 合格したという知らせ (a notícia de que passou).'},
{g:'～ために (目的)',f:'V辞書形 / Nの + ために',pt:'para, com o objetivo de',en:'in order to',ex:'健康のために毎朝走っている。',tx:'Corro toda manhã pela saúde.',trap:'Exige verbo <b>volitivo</b> e mesmo sujeito nas duas partes. Se o verbo for potencial ou negativo, o correto é ように: 遅れないように早く出た.'},

{g:'～つもり / ～予定',f:'V辞書形 + つもり / Nの + 予定',pt:'pretender / estar agendado',en:'intend to / be scheduled',ex:'来年帰国するつもりです。',tx:'Pretendo voltar ao meu país ano que vem.',trap:'<b>つもり</b> = intenção pessoal (pode mudar). <b>予定</b> = agendado, já combinado. Falar 「社長は来るつもりです」sobre um superior é indelicado — use いらっしゃる予定です.'},

{g:'～こと / ～の (名詞化)',f:'V辞書形 + こと / の',pt:'nominalizador',en:'nominalizer',ex:'泳ぐのが好きです。',tx:'Gosto de nadar.',trap:'⚠ Com verbos de <b>percepção direta</b> (見る・聞く・感じる) só の: 彼が走るのを見た ✓ / 走ることを見た ✗. Com 決める・できる・約束する só こと. Em português o infinitivo cobre tudo.'},

'～おかげで / ～せいで':'<b>おかげで</b> only for good outcomes; <b>せいで</b> only for bad ones. English "because of" covers both — in Japanese picking wrong is a tone error, not a grammar error.',
'～ため(に)':'Two senses. With a <b>noun or past form</b> = cause. With a <b>volitional dictionary-form verb</b> = purpose. Form and context decide. More formal than から/ので.',
'～によって':'Three uses. In the <b>passive</b> it marks the agent (発見された). With "varies" it means "depending on". Don\'t confuse with ために (purpose).',

'～がる':'<b>Emotion</b> adjectives (寒い・ほしい・怖い・うれしい) can\'t be asserted of a third person directly. 「彼は寒い」✗ → 彼は寒がっている. English has no equivalent restriction.',

'～はじめる / ～だす':'<b>だす</b> = a <b>sudden, involuntary</b> start. <b>はじめる</b> = neutral or planned. 「勉強しだす」sounds odd; 「泣きだす」is natural.',

'～てみる':'≠ ～ようとする (attempt with effort, may fail). てみる is "I do it and see what happens". Compare 泳ごうとしたができなかった vs 泳いでみた.',
'～ていく / ～てくる':'A <b>time</b> axis, not a spatial one. <b>てくる</b> = from the past up to now (寒くなってきた). <b>ていく</b> = from now into the future. English doesn\'t mark this, so it\'s easy to pick wrong.',
'～てあげる / ～てくれる / ～てもらう':'⚠ The single biggest hurdle for European learners. English "helped me" is neutral; in Japanese <b>dropping くれる sounds cold or even rude</b>. 「友だちが手伝った」reads like a distant report. And てあげる toward a superior sounds condescending — use お手伝いします.',
'～(ら)れる (受身)':'The agent takes <b>に</b>, not によって (except in formal or creative-work contexts). And the Japanese passive usually implies the speaker was <b>affected</b> — it is used far less often than the English passive.',
'～(さ)せる (使役)':'With a <b>transitive</b> verb the person takes に; with an <b>intransitive</b> one they take を (子供を行かせる). And させてください = "please let me" — a permission request you\'ll use constantly at work.',
'お～になる / お～する':'⚠ <b>になる</b> = the other person acts (respect). <b>する</b> = I act (humility). Swapping them is the worst 敬語 error and it appears directly on the exam. 「お持ちします」= I\'ll carry it; 「お持ちになります」= you carry it.',
'～なければならない / ～なくてもいい':'In speech: なきゃ / なくちゃ. Watch the pair: <b>なくてもいい</b> = don\'t need to; <b>てはいけない</b> = must not. English "don\'t have to" vs "must not" trips learners in both directions.',
'～てはいけない / ～てもいい':'てはいけない is a <b>direct prohibition</b> — far too strong to aim at a superior. With a boss or client use ご遠慮ください.',
'～たほうがいい':'The affirmative takes the <b>た</b> form (行ったほうがいい); the negative takes <b>ない</b> (行かないほうがいい). Using 行くほうがいい shifts the meaning to comparing options.',
'～ことがある':'⚠ <b>た form</b> = life experience. <b>Dictionary form</b> = happens occasionally (電車が遅れることがある). One syllable separates "I have done it" from "it sometimes happens".',
'～ないで / ～なくて':'<b>ないで</b> = without doing (simultaneous) or "instead of". <b>なくて</b> = cause ("because it isn\'t"). 分からなくて困った ✓ / 分からないで困った ✗.',
'～し':'It lists <b>reasons</b>, not actions in sequence. For sequence use the て form. Usually comes in pairs (～し、～し).',
'～たり～たりする':'A list of <b>examples</b>, not a complete sequence. Always close with する and conjugate only that final する.',
'～かどうか':'⚠ "If" as an <b>indirect question</b> is never もし or たら. If the question contains 何/どこ/だれ, use plain か: 何時に来るか分からない.',
'～という':'Used when the listener <b>doesn\'t know</b> the name. It also introduces content: 合格したという知らせ (the news that you passed).',
'～ために (目的)':'Requires a <b>volitional</b> verb and the same subject in both clauses. If the verb is potential or negative, you need ように: 遅れないように早く出た.',
'～ように (目的)':'The obligatory partner to ために. Rule: <b>I control the outcome → ために</b>; <b>I don\'t → ように</b>. This pair alone is worth several marks.',
'～つもり / ～予定':'<b>つもり</b> = personal intention (can change). <b>予定</b> = scheduled, already arranged. Saying 「社長は来るつもりです」about a superior is rude — use いらっしゃる予定です.',
'～ばかり':'Carries <b>criticism</b>. Different from だけ (only, neutral). And ～たばかり (just did) is a separate pattern — don\'t merge them.',

'Three markers in a row: 「一方で」turns the argument, 「かえって」signals a result opposite to expectation, and 「だけでは足りない」opens the conclusion. In N2 passages, follow the connectors and you reach the thesis without parsing every word.',
'A <b>統合理解</b> question (two texts). Two-step method: first write each writer\'s stance in one word (A = for, B = against); then find the <b>single point both texts mention</b> — here, money — and compare only on that. Don\'t try to compare everything.',
'The maths: 全日会員 8,000 − student discount 2,000 = 6,000. The 3,000 joining fee would be added, but 「三月中の入会は無料」waives it. The <b>情報検索</b> rule: read the question first, then hunt down <b>every</b> condition that applies to it. Miss one line and you miss the mark.',
'With a list of requirements, the correct option satisfies <b>all</b> of them; each distractor breaks exactly one: one is a first-year (wrong year), one already holds a scholarship, one posts it late and by mail. Number each condition and check them off one by one.',
'Two signals close this question. <b>「～ではないか」</b> is a soft assertion — usually the thesis. And the final sentence runs 「～必要はないが、～たい」: what follows が is what the writer actually argues. Note he does <b>not</b> ask you to abandon the technology; the choice "never use the tools" overstates his position, a classic trap.',
'In business email the <b>real request sits in the final paragraph</b>. The forms 「～いただけますと助かります」「～いただけないでしょうか」mark the ask; everything before it is context that justifies it. When the question is "what does he want?", read the end first.',
'<b>「つまり」</b> is the most generous marker in N2 reading: the sentence after it is the writer\'s own summary, and it is often the answer verbatim. Notice the topic too — it is your recurring problem: a word no other language covers with a single term.',
'<b>「～わけではない」</b> denies a conclusion the reader might draw, and the reason follows immediately in 「からだ」. In plain terms: the app delivers <b>meaning</b>, not <b>relationship</b> or <b>register</b>. That is exactly the difference between 貸す/借りる and between あげる/くれる.'
];

const P_SHUUCHUU='勉強でも仕事でも、能率には必ず波がある。波がないように見えても、それは波が小さいだけだ。一時間で五十ページ読めたから、十時間で五百ページ読める、という計算は成り立たない。\u3000ここで多くの人がつまずくのは、調子が最もよかったときを基準に計画を立ててしまうことだ。その基準では、たいていの日は「できなかった日」になる。そのたびに自分の能力を疑っていたら、疑い続けることになる。\u3000計画は、中くらいの調子のときを基準に作るほうがいい。予定より進んでしまって困る人はいない。そして調子が落ちている日は、悲観せずに次の波を待てばいい。波は必ず来る。';
const P_OSHIERU='どんな仕事にも、手引きのようなものがある。「できる人」は、その手引きを理解したうえで、目の前の状況に合わせて自分で応用してしまう。本人にとっては自然な動作であり、周りにとってもありがたい。\u3000ところが、その人が今度は人を育てる立場になったとき、思わぬ壁にぶつかる。自分が自然にやってきたことを、なかなかできない人が大勢いるという事実だ。頭では分かっても、感覚としてはつかめない。\u3000そのため助言は、「手引きの先が見えている人の世界」の言葉で語られてしまう。しかし聞く側は、まだその先が見えていない。うまく伝わらないのは、むしろ当然なのである。';
const P_YOMU='「分かる」とは「分ける」ことだ、とよく言われる。頭の中にラベルのついた箱がいくつも並んでいて、入ってきた情報を「これはこっちの箱」と仕分けていく。①<u>その作業がうまくいったとき、私たちは「分かった」と感じる</u>。\u3000ところが、どの箱にも入らない情報がやってくることがある。分けられないのだから、分からない。そしてこの「分からない」状態に、人はなかなか耐えられない。\u3000そんなとき、その内容を手近な箱に無理やり押し込んでくれる説明があると、私たちはそれを「分かりやすい」と感じてしまう。だが、それは安心するための、その場かぎりの説明である。②<u>誤った箱に入れられた情報は二度と見直されない</u>。分かったつもりになった分だけ、本当の理解からは遠ざかる。\u3000だから私は、学ぶ人にこう言いたい。「分からない」というラベルの箱を一つ作り、行き場のない情報はひとまずそこへ入れておけばいい。落ち着かないかもしれないが、ときどき中をのぞきながら進んでいくと、ある日いくつかの情報が結びつき、新しい箱が立ち上がる。それが本当に「分かった」瞬間だ。';
const P_AB_A='私は紙の本で読むほうがいい。ページをめくる手の感覚や、本の厚みが、内容の記憶と結びつくからだ。あのあたりに書いてあった、という思い出し方ができるのは紙ならではだと思う。電子書籍は確かに便利だが、どこを読んでいるのかが体で分からない。読み終えたあとに頭に残る量が、私の場合は明らかに違う。';
const P_AB_B='電子書籍の利点は、持ち運びと検索だ。何十冊も鞄に入り、あの言葉はどこだったかと思えば一瞬で見つかる。紙のほうが記憶に残るという人もいるが、それは慣れの問題ではないだろうか。私は電子書籍に切り替えてから読む量が三倍になった。読まれない紙の本より、読まれる電子書籍のほうがいい。';
const P_RYOKIN='みどり自然公園\u3000ご利用案内\u3000▼入園料（一名・一日）\u3000・大人（十八歳以上）八百円\u3000・子供（六歳以上十八歳未満）四百円\u3000・六歳未満は無料\u3000▼団体割引：十名以上でお申し込みの場合、全員の入園料が二割引になります。\u3000▼年間パスポート：大人三千円、子供千五百円。購入日から一年間、何度でもご入園いただけます。\u3000▼園内バス：一日乗り放題二百円（年齢を問わず一律）。年間パスポートをお持ちの方は無料です。\u3000▼ご予約：団体でのご利用は、利用日の一週間前までに電話でお申し込みください。個人のお客様のご予約は必要ありません。';
const MONDAI_R2=[
{s:'読解',p:'言葉は、自分の頭の中にしかない。相手の言葉も、相手の頭の中にしかない。とくに抽象的な言葉の場合、二人がまったく同じ意味で使っていることのほうが少ないだろう。\u3000だから、議論をするときは、まず言葉の意味をそろえる作業が要る。相手がその言葉をどういう意味で使っているのか、自分と同じなのか。それを確かめないまま進めた議論は、どこまで行ってもかみ合わない。',
 q:'筆者によると、論理的な議論をするために必要なことは何か。',o:['同じ言葉を互いに同じ意味で使っているか確認すること','抽象的な言葉はできるだけ使わないようにすること','相手の知らない言葉には必ず説明を加えること','言葉の正しい意味を辞書で調べてから話すこと'],a:0,
 ex:'A tese está na segunda metade: 「まず言葉の意味をそろえる作業が要る」. As alternativas sobre "evitar palavras abstratas" e "explicar palavras desconhecidas" propõem soluções que o texto <b>não</b> menciona — cuidado com alternativas razoáveis mas ausentes. No N2, a resposta certa nunca é apenas plausível: ela tem que estar <b>escrita</b>.'},
{s:'読解',p:'図書館システム一時停止のお知らせ\u3000いつも当館をご利用いただきありがとうございます。設備の入れ替えのため、三月十日（月）午前二時から午前六時まで、貸出・返却システムを停止いたします。\u3000この間、インターネットでの予約および貸出期間の延長ができなくなります。なお、蔵書の検索および開館時間のご確認は通常どおり行えます。\u3000館内の窓口業務は当日十時から通常どおり営業いたします。ご不便をおかけしますが、ご理解のほどお願い申し上げます。',
 q:'このお知らせで伝えたいことは何か。',o:['三月十日の未明は、ネットでの予約と延長ができない','三月十日は一日中、図書館が閉まっている','三月十日から蔵書の検索ができなくなる','三月十日の十時までに本を返さなければならない'],a:0,
 ex:'Avisos de sistema sempre separam <b>o que para</b> de <b>o que continua</b>. Aqui: param 予約 e 延長; continuam 検索 e 開館時間の確認. E 「窓口業務は通常どおり」elimina a alternativa "a biblioteca fica fechada o dia todo". Marque essa divisão com dois traços antes de olhar as alternativas.'},
{s:'読解',p:'初夏の朝、木の幹にセミの抜け殻を見つけることがある。あの薄い殻は、数時間前まで生きていた体の一部だ。\u3000セミは土の中で数年を過ごし、地上に出て木に登り、背中を割って外へ出る。羽が伸びて固まるまでの一、二時間、動くことができない。この間に鳥に見つかれば終わりだ。だから羽化はほとんど夜のうちに行われる。\u3000朝に見る抜け殻は、その危険な時間を無事に越えた証拠なのである。',
 q:'セミが夜のうちに羽化するのはなぜか。',o:['羽が固まるまで動けず、敵に襲われる危険があるから','夜のほうが気温が下がって羽が固まりやすいから','昼間は木の幹が乾いていて登りにくいから','土の中から出るのに数時間かかるから'],a:0,
 ex:'Textos de divulgação científica encadeiam <b>fato → consequência</b>. Localize o 「だから」: tudo o que vem antes dele é a causa. As alternativas sobre a temperatura e sobre o tronco seco inventam causas plausíveis que o texto não dá — de novo, plausível ≠ escrito.'},
{s:'読解',p:'株式会社みなと産業\u3000営業部\u3000川島様\u3000いつもお世話になっております。ヒノデ商会の森です。\u3000先日ご送付いただいた新型棚のカタログを拝見しました。社内で検討したところ、高さ百八十センチの型を扱いたいという意見が多く出ております。\u3000つきましては、この型の見本を一台お借りできないでしょうか。実際に店舗に置いて、通路の幅との兼ね合いを確認したいと考えております。送料が必要でしたら当方で負担いたします。\u3000正式に取り扱いが決まりましたら、まずは十台を注文する予定です。ご検討のほど、よろしくお願いいたします。',
 q:'このメールで相手に依頼していることは何か。',o:['商品の見本を一台貸してほしい','商品を十台送ってほしい','新しいカタログを送ってほしい','送料がいくらかかるか教えてほしい'],a:0,
 ex:'Duas expressões-chave: 「つきましては」anuncia que o pedido vem agora, e 「お借りできないでしょうか」é o pedido em si — <b>emprestar</b>, não comprar. A alternativa "enviar dez unidades" usa o número 十台 que está no texto, mas ele se refere a um pedido <b>futuro e condicional</b> (取り扱いが決まりましたら). Números reaproveitados fora de contexto são o distrator favorito do N2.'},
{s:'読解',p:'受験や就職、あるいは昇進といった競争の中にいると、そこでの勝ち負けが人生のすべてであるかのように感じられてくる。\u3000しかし、誰かを支えたり育てたりする仕事に喜びを見いだす人もいる。仕事はほどほどにして、趣味に生きることを楽しむ人もいる。競争にたまたま敗れたとしても、それで終わりというわけではない。\u3000視点を少し動かせば、そこにはいくつもの生き方の世界が広がっている。',
 q:'筆者の考えに合うのはどれか。',o:['人生の選択肢は多様で、生き方は一つではない','競争を避けて自分の生き方を探すほうがよい','選択肢が多いほど人生は豊かになっていく','仕事より趣味を大切にしたほうが幸せになれる'],a:0,
 ex:'Reconheça o exagero. O texto diz que a competição <b>não é tudo</b>; a alternativa "evitar a competição" manda <b>fugir dela</b> — mais forte do que o autor afirmou. Distratores no N2 tipicamente pegam a tese e a empurram um passo além. Se a alternativa é mais radical que o texto, quase sempre está errada.'},
{s:'読解',p:P_SHUUCHUU,q:'筆者によると、計画を立てるときの注意点は何か。',

 ex:'Roberto, este texto é literalmente sobre o seu plano de estudo. A instrução está em 「計画は、中くらいの調子のときを基準に作るほうがいい」. Técnica: quando a pergunta pede um 注意点 (ponto de atenção), procure a frase com <b>ほうがいい / べきだ / 必要がある</b>.'},
{s:'読解',p:P_SHUUCHUU,q:'能率の波について、筆者はどのように考えているか。',
 o:['波があるのは当然なので、落ちている日は次の波を待てばよい','波をなくす方法を身につけることが大切だ','波が大きい人ほど能力が高いといえる','波が来ないときは休まずに努力を続けるべきだ'],a:0,
 ex:'Último parágrafo: 「悲観せずに次の波を待てばいい。波は必ず来る」. Em textos de dois ou três parágrafos, o <b>fecho carrega a atitude</b> que o autor recomenda. Leia o último período antes das alternativas — economiza tempo e evita distratores do meio do texto.'},
{s:'読解',p:P_OSHIERU,q:'筆者によると、「できる人」とはどのような人か。',
 o:['手引きを理解したうえで、状況に合わせて応用できる人','手引きを使わずに自分のやり方で対応できる人','手引きの問題点を見つけて改善できる人','手引きどおりに正確に対応できる人'],a:0,
 ex:'A definição está na primeira frase do texto: 「手引きを理解したうえで…自分で応用してしまう」. Note o <b>～たうえで</b>: entender vem <b>primeiro</b> e serve de base. A alternativa "sem usar o manual" corta essa primeira metade — e é justamente aí que o N2 arma a armadilha.'},
{s:'読解',p:P_OSHIERU,q:'「できる人」が人を育てるときに問題になることは何か。',
 o:['自分にできることでも、それができない人がいると実感しにくいこと','自分ができないことを説明できないこと','相手に期待をかけすぎてしまうこと','手引きを使わずに教えてしまうこと'],a:0,
 ex:'A chave é 「頭では分かっても、感覚としてはつかめない」— saber intelectualmente mas não <b>sentir</b>. A alternativa "não consegue explicar o que não sabe fazer" inverte o texto: o problema é justamente com o que ele <b>sabe</b> fazer. Sempre confira se a alternativa não trocou o sinal da frase original.'},
{s:'読解',p:P_AB_A+'\u3000【B】'+P_AB_B,q:'紙の本と電子書籍について、AとBが共通して述べていることは何か。',
 o:['どちらも、記憶への残りやすさに違いがあると言われていることに触れている','どちらも、電子書籍のほうが読む量が増えると述べている','どちらも、紙の本のほうが内容を思い出しやすいと述べている','どちらも、持ち運びやすさを最も重視している'],a:0,
 ex:'⚠ Em 統合理解, "共通して述べている" quase nunca significa "concordam". Significa que <b>os dois tocam no mesmo ponto</b>. A memória aparece em A (a favor do papel) e em B (「記憶に残るという人もいるが」, para refutar). Tocar no tema é suficiente; concordar não é exigido.'},
{s:'読解',p:P_AB_A+'\u3000【B】'+P_AB_B,q:'電子書籍について、AとBはどのように述べているか。',

 ex:'Método em duas colunas: escreva A = papel (posição no corpo), B = digital (é questão de hábito). Repare que A <b>admite</b> a conveniência (「確かに便利だが」) — por isso a alternativa "A nega a conveniência" cai. Concessões como 確かに・もちろん existem para você não simplificar a posição do autor.'},
{s:'読解',p:P_YOMU,q:'①その作業とあるが、どのような作業か。',

 ex:'Questão de <b>指示語</b> (referência). Regra: o referente está quase sempre <b>imediatamente antes</b> do sublinhado. Aqui: 「入ってきた情報を『これはこっちの箱』と仕分けていく」. Nunca procure longe antes de esgotar a frase anterior.'},
{s:'読解',p:P_YOMU,q:'②誤った箱に入れられた情報は二度と見直されないとあるが、なぜか。',

 ex:'A causa está na frase seguinte: 「分かったつもりになった分だけ、本当の理解からは遠ざかる」. Em perguntas なぜ sobre um trecho sublinhado, a resposta fica <b>logo antes ou logo depois</b>. Leia as duas frases vizinhas antes de qualquer coisa.'},
{s:'読解',p:P_YOMU,q:'筆者が学ぶ人に最も伝えたいことは何か。',
 o:['「分からない」状態をそのまま抱えておく態度が大切だ','「分からない」ことは早く解決したほうがよい','分かりやすい説明を選んで学ぶべきだ','箱の数を増やせば理解が深まる'],a:0,
 ex:'Roberto — leia esta duas vezes. A tese está em 「『分からない』というラベルの箱を一つ作り…ひとまずそこへ入れておけばいい」. É o oposto do que o instinto pede. Em 長文, a estrutura costuma ser: senso comum → problema do senso comum → <b>proposta do autor no fim</b>.'},
{s:'読解',p:P_RYOKIN,q:'大人二名と七歳の子供一名で入園し、三名とも園内バスを利用する場合、合計金額はいくらか。',

 ex:'Cálculo: 入園料 800×2 + 400 = 2.000. Bus 200×3 = 600. Total 2.600. O desconto de grupo exige 十名以上 (são 3) e o passe anual não foi comprado. <b>Método</b>: liste primeiro quem paga o quê, depois cheque cada condição especial e descarte as que não se aplicam. Quem esquece o ônibus da criança marca 2.400.'},
{s:'読解',p:P_RYOKIN,q:'この案内の内容と合っているものはどれか。',

 ex:'Questões de 内容一致 se resolvem por <b>eliminação</b>, checando alternativa por alternativa contra o texto: "individual precisa reservar" → 「個人のお客様のご予約は必要ありません」✗; "passe anual paga o ônibus" → 「年間パスポートをお持ちの方は無料」✗; "criança de 5 anos paga 400" → 「六歳未満は無料」✗. Nunca leia o texto inteiro procurando a certa — teste as erradas.'},
{s:'読解',p:'人との関係についての悩みには、共通する感じがあるように思う。それは「自分ではどうにもならない」という感じだ。相手がこうなってくれないと解決しない、相手がこういう人だからこちらには何もできない、という形になりやすい。\u3000その状況を動かそうとして、人は「自分を変えよう」と努力することがある。しかし、状況を解決するためだけに変わろうとすると、今度は自分が見えなくなる。\u3000自分を見失った状態は、かえって苦しく、事態も動かない。自分を保ったまま正面から悩み、その結果として自然に変わっていく——そういう形の変化でなければ、うまくいかないようだ。実はそうした変化のことを、私たちはふつう「成長」と呼んでいる。',
 q:'人間関係の悩みに共通することとして、筆者が述べているのはどれか。',

{s:'語彙',q:'虫が飛んできたので、手に持っていた帽子を振って遠くに＿。',o:['追い払った','取り払った','揉み出した','連れ出した'],a:0,

{s:'語彙',q:'台風で電車が運休になり、通勤や通学で利用する人に＿影響を与えた。',o:['多大な','大まかな','偉大な','大げさな'],a:0,

{s:'語彙',q:'西川さんは転校してきたばかりだが、友達もできて、もうすっかりクラスに＿いる。',o:['溶け込んで','当てはまって','結びついて','触れ合って'],a:0,

{s:'文法',q:'（旅館で）旅館の人「いらっしゃいませ。本日は森川旅館に＿、ありがとうございます。」',o:['お越しくださり','伺いまして','参りまして','おいでくださり'],a:0,

{s:'文法',q:'私は猫アレルギーで、猫に触ると体がかゆくなってしまうのだが、猫は好きなので、見るとつい＿。',o:['触ってみたくなってしまう','触ってみたがっている','触ってみてほしがっている','触ってみてほしくなってしまう'],a:0,

'教育<b>論</b> = a theory or discourse on education. The suffix ～論 forms "theory of X": 人生論・組織論・精神論. The others exist but only in fixed slots: 規則・原理・法則. Suffixes are a memorisable block — there is nothing to guess.',
'<b>悪</b>条件 = adverse conditions. Productive N2 prefixes: 悪～ (悪条件・悪影響), 好～ (好条件), 高～ (高性能), 低～, 未～ (未経験), 無～ (無関係), 不～ (不十分). Build your list by prefix, not by word.',
'生活<b>スタイル</b> = lifestyle. Loanwords are tested on <b>collocation</b>, not original meaning: ポーズ is a body posture, ブランド a commercial brand, シリーズ a run of products. Always store the 名詞＋カタカナ pair together.',
'決定<b>権</b> = decision-making authority. The suffix ～権 marks a right or power: 選挙権・所有権・著作権. 決定力 would work in football (finishing ability) — but with 社長 and 方針 the register is legal.',
'先着<b>順</b> = in order of arrival, first come first served. ～順 = ordered by some criterion: 五十音順・人気順・到着順. A fixed phrase in public notices, and therefore in the exam\'s 情報検索 section too.',
'<b>仮</b>予約 = a provisional booking. The prefix 仮～ = temporary: 仮登録・仮採用・仮払い. Heavily used in administrative texts — exactly the register of 問題14.',
'<b>関与</b> = involvement (usually in something negative). 参列 is attending a ceremony; 加入 is enrolling in a scheme; 登場 is appearing on the scene. All translate loosely as "take part" — the difference is <b>what kind of thing</b> you take part in.',
'<b>べたべた</b> = sticky (oil, glue). N2 onomatopoeia is worth learning in a block: かさかさ (dried out), じめじめ (damp and muggy), ちくちく (prickling), ぬるぬる (slimy), くたくた (worn out).',
'<b>追い払う</b> = to shoo away (a living thing). 取り払う is removing a structure (壁を取り払う). Compound verbs in 追い～ form a family: 追いかける・追い越す・追い出す — study the first element, not each compound alone.',
'<b>多大な</b>影響 = an enormous impact. A fixed collocation. 大まかな = rough, approximate (大まかな計画); 偉大な = great, for people and achievements; 大げさな = exaggerated. All contain 大 and all sound "big" — only collocation separates them.',

'熱中する = to <b>throw yourself into</b> an activity over a period. It needs an <b>activity</b> (野球・研究・ゲーム), not an object and not a collective emotion. Criticism 集中する; loving a piece of clothing is 気に入る. Verbs of absorption demand an activity, not a thing.',

'Structure: <b>expectation → denial → reason</b>. The line 「そうでもない」denies the expectation, and 「からだ」supplies the reason. The choice saying speed is pointless overshoots the text: it grants that speed improves.',

'Mind the <b>scope</b>. Taste and conversation appear only as <b>examples</b> (「かもしれない」), and the conclusion is 「値段以外のところにある」. The right choice has to cover both examples, not pick one.',
'The pair <b>ではなく～が要る</b> at the close carries the proposal, and the quoted line shows its concrete shape. When a short passage includes speech in 「」, it almost always illustrates the answer.',

'Roberto — apply this to Japanese. The recommendation arrives with <b>ほうがいい</b> at the end: 「失敗しにくい形に目標を作り直す」. The ninety-minute example shows <b>how</b>, and the right choice is the one that generalises it.',
'情報検索 method: every sentence is a condition. 「二十時以降は通常どおり」kills the all-day-closed idea; 「取り直しをお願い」kills the one about reservations still being valid; 「テイクアウトは裏口にて承っております」confirms the right one.',
'The closing line 「撮る側が選ばなければ、見る側は選べない」is a <b>restatement</b> of the opening thesis. In short passages the first and last sentences tend to say the same thing two ways — when they match, you have your answer.',
'⚠ 「～わけではない」in line two denies exactly the most attractive distractor. And 「ということだ」at the end marks the writer\u2019s own definition. Two grammar points settle the whole question, with no need to parse every word.',
'The question asks なぜ, so hunt for 「からだ」: 「直すための時間や手順が用意されていないからだ」. The choices about not understanding and about motivation are the very ones the text <b>discards</b>.',

'The passage opens with 「～と思われがちだ」(people tend to think) and turns with 「しかし実際には」. That pair is N2\u2019s most reliable signal: whatever follows 実際には is the writer\u2019s position.',

const EN_KEIGO={
'いらっしゃる':['The professor is in his office.','⚠ Three verbs in one. And it is <b>irregular</b> in the ます form: いらっしゃ<b>います</b>, not いらっしゃります. The same irregularity hits おっしゃる・くださる・なさる・ござる — the five special 五段.'],
'おいでになる':['The president is coming tomorrow.','An alternative to いらっしゃる, slightly more formal. For "come" there are also お越しになる and お見えになる — all about the <b>other person</b>, never about you.'],
'参る':['I am on my way.','⚠ 参る is <b>丁重語</b>: it lowers your own speech even with no exalted listener. That is why 「電車が参ります」works as a station announcement — a train has no humility, but the speaker does.'],
'伺う':['I will come at three tomorrow.','Four verbs in one, but <b>only about yourself</b>. 「先生が伺いました」✗ — that would need いらっしゃいました. Swapping humble and honorific is the most heavily penalised error on N2.'],

'召し上がる':['Please help yourself.','Covers eating <b>and</b> drinking. 「食べられますか」is grammatical but weak; 召し上がりますか is the service standard.'],

'おっしゃる':['It is exactly as the teacher said.','Irregular ます form: おっしゃ<b>います</b>. And to ask a name: 「お名前は何とおっしゃいますか」— never 「何と申しますか」, which would be talking about yourself.'],

'拝見する':['I have read your letter.','拝 means "to bow before" and forms a whole block of humbles: 拝見 (see), 拝読 (read), 拝借 (borrow), 拝聴 (listen). Learn the four together.'],
'なさる':['What would you like to do?','Irregular ます form: なさ<b>います</b>. It also builds requests: 「ご注文なさいますか」. Do not confuse it with いたす, which is you doing the action.'],
'いたす':['I will confirm it.','⚠ The pair なさる／いたす is the classic N2 question. One rule: <b>they なさる, I いたす</b>. If the subject is 私, never なさる.'],
'ご存じだ':['Are you aware of this matter?','There is no standard 「知っていらっしゃいますか」— use ご存じですか. And the polite negative is 「ご存じないようです」.'],
'存じる / 存じ上げる':['I am aware of that matter.','⚠ A fine split: <b>存じております</b> for things, <b>存じ上げております</b> for people. 「田中様を存じ上げております」= I know Mr Tanaka.'],
'お目にかかる':['It is an honour to meet you.','Literally "to reach the other person\u2019s eyes". Only about yourself: 「先生にお目にかかる」✓ / 「先生が私にお目にかかる」✗.'],
'くださる':['The teacher lent me a book.','Irregular ます form: くださ<b>います</b>. It is the honorific くれる — the action comes <b>toward you</b>. Without it the sentence reads distant, as the traps section showed.'],
'差し上げる':['I will send you the materials.','⚠ Careful: offering 差し上げる to a superior can sound condescending, like "doing him a favour". Often the natural choice is 「お送りいたします」.'],
'頂戴する':['I received a splendid gift.','More formal than いただく. Also used when asking: 「お名刺を頂戴できますか」= could I have your card?'],
'承る':['I have taken your order.','Service vocabulary. From 承 (to accept from above). It turns up on the phone: 「ご用件を承ります」.'],
'お召しになる':['That is a lovely coat you are wearing.','召す is an old all-purpose verb: 召し上がる (eat), お召しになる (wear), 風邪を召す (catch a cold), お気に召す (be pleasing).'],
'お休みになる':['The president has already gone to bed.','Built from the general mould <b>お + ます-stem + になる</b>. Master that mould and you can form honorifics for almost any verb without memorising them.'],

'でございます':['This is the meeting room.','It is 丁重語, not honorific: it raises the register, not the listener. That is why it works for objects: 「三階でございます」.'],
'お / ご（美化語）':['Thank you for getting in touch.','Rule of thumb: <b>お</b> with native words (お名前・お時間・お知らせ), <b>ご</b> with Sino-Japanese compounds (ご住所・ご連絡・ご確認). Exceptions to memorise: お電話・お食事・お返事.'],
'尊敬語と謙譲語の使い分け':['The teacher comes, and I go to him.','⚠ One rule settles almost every question: ask <b>who the subject is</b>. Subject = the other person → 尊敬語. Subject = me or my group → 謙譲語. Never decide by the tone of the sentence.'],
'身内には謙譲語':['(to a client) Tanaka, our manager, is away from his desk.','⚠ The point nearly every foreign speaker gets wrong: speaking to someone <b>outside</b>, your own boss loses the honorific and even the さん. 「部長の田中は…おります」, not 「田中部長がいらっしゃいます」.'],
'二重敬語':['Wrong: おっしゃられる. Right: おっしゃる.','⚠ Stacking two honorifics counts as an <b>error</b>, not extra politeness: お読みになられる ✗, ご覧になられる ✗. One layer is enough. The one exception fixed by usage: お召し上がりになる.']

/* ═══ English overlay: 自動詞・他動詞 ═══ */
const EN_JITA={

'閉める / 閉まる':['I close the door. / The door closes.','Note the pattern: <b>e-ru = transitive, a-ru = intransitive</b>. 閉める/閉まる, 決める/決まる, 集める/集まる, 始める/始まる all follow it.'],
'始める / 始まる':['I start the class. / The class starts.','The person who decides uses 始める; the event that occurs uses 始まる. In an announcement, 「試験が始まります」— no agent is in view.'],
'決める / 決まる':['I set the date. / The date gets set.','This links to the ことにする／ことになる pair on your cards: Japanese prefers the agentless version even when the decision was yours.'],

'落とす / 落ちる':['I dropped my wallet. / The glass fell.','落とす also means to fail somebody and 落ちる to be failed: 試験に落ちる. Roberto, this pair has personal history — this time we are using 受かる.'],
'消す / 消える':['I turn off the light. / The light goes out.','The <b>-su / -eru</b> pattern: 消す/消える, 壊す/壊れる, 汚す/汚れる, 倒す/倒れる. The -su member is always the transitive one.'],
'つける / つく':['I turn on the air conditioning. / The light comes on.','Pairs with 消す/消える. Also "to stick": 名札をつける / 泥がつく. And 気をつける is a fixed expression, not a pair.'],
'直す / 直る':['I correct the mistake. / The fault gets fixed.','For health it is written 治す/治る: 風邪を治す / 風邪が治る. Same sound, different kanji depending on whether it is an object or an illness.'],
'壊す / 壊れる':['I broke the watch. / The watch broke.','In English "I broke the watch" and "the watch broke" share one verb. In Japanese the choice reveals whether you are taking the blame — 壊れた is the diplomatic exit.'],
'割る / 割れる':['I break the plate. / The glass cracks.','Reserved for things that shatter: glass, china, eggs. Do not use it for appliances — that is 壊れる.'],
'倒す / 倒れる':['I fell the tree. / The tree falls.','倒れる also means to collapse from illness: 過労で倒れた. Common in news, and therefore in exam reading.'],
'動かす / 動く':['I move the desk. / The clock is not working.','動く covers "to work" for machines. 「この機械は動きますか」= does this machine work?'],
'立てる / 立つ':['I make a plan. / He stands up.','計画を立てる is a fixed collocation and appears on the exam. 役に立つ (to be useful) uses the intransitive — 役に立てる exists but means "to manage to be useful".'],
'並べる / 並ぶ':['I lay out the goods. / Customers queue up.','People 並ぶ of their own accord; goods are 並べられる by someone. The same logic as 集まる/集める.'],
'上げる / 上がる':['I raise the price. / The temperature rises.','Pairs with 下げる/下がる. In N2 economics passages they appear constantly: 「物価が上がる」vs 「政府が税を上げる」— who acts changes the verb.'],
'下げる / 下がる':['I turn the volume down. / The fever goes down.','頭が下がる (to be humbled with admiration) is a fixed expression using the intransitive — it is in your N2+ deck.'],
'変える / 変わる':['I change the plan. / The plan changes.','Agentless 変わる is the polite way to announce changes: 「時間が変わりました」blames nobody for the alteration.'],
'増やす / 増える':['I increase the headcount. / The population grows.','With 減らす/減る it forms the quartet of graphs. In statistical reading, the choice of verb tells you whether policy or natural trend is behind the number.'],
'減らす / 減る':['I cut down on salt. / My income drops.','減る is intransitive, so 「お腹が減る」(to be hungry) takes no を — literally "the belly decreases".'],
'届ける / 届く':['I deliver the parcel. / The parcel arrives.','届く also means to reach: 手が届く (reach with your hand), 声が届く (the voice carries). Always with が.'],
'助ける / 助かる':['I save someone. / Many lives were saved.','⚠ 「助かりました」is the most natural way to thank someone for practical help — literally "I was saved". Do not say 「あなたが私を助けました」, which reads like a report.'],
'残す / 残る':['I leave a note. / There is work left over.','記録に残る (to go on record) and 印象に残る (to stay in your memory) are fixed collocations using the intransitive.'],
'進める / 進む':['I push the plan forward. / The construction advances.','⚠ Do not confuse it with 勧める すすめる (to recommend), identical reading, different kanji. 話を進める vs 本を勧める.'],
'育てる / 育つ':['I raise the child. / The child grows up.','育つ is to grow in development; 伸びる is to grow in size or performance (成績が伸びる).'],
'冷やす / 冷える':['I chill the beer. / At night the air gets cold.','A useful trio: 冷やす (I chill it), 冷える (it gets cold by itself), 冷ます (I let something hot cool down). The third one shows up on the exam.'],
'戻す / 戻る':['I put the book back on the shelf. / The memory comes back.','戻る is to return to a previous point; 帰る is to return where you belong (home, country). An employee who steps out and comes back to the office 戻ります, not 帰ります.']
